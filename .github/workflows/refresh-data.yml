name: صيانة شهرية لبيانات المحطات

on:
  schedule:
    - cron: '17 2 1 * *'   # أول كل شهر الساعة 05:17 بتوقيت الرياض
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: سحب وتحديث بيانات المحطات
        run: python scripts/refresh_data.py
      - name: رفع التحديث لو فيه تغيير
        run: |
          git config user.name "radio-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html
          if git diff --cached --quiet; then
            echo "مفيش تغيير"
          else
            git commit -m "صيانة شهرية تلقائية لبيانات المحطات"
            git push
          fi
