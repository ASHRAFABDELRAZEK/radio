<head>

<!-- راديو العالم | إعداد وتصميم: ASHRAF FATHY | جميع الحقوق محفوظة © 2026 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
:root{--bg:#0a1628;--card:#112240;--card2:#0e1d38;--acc:#0F766E;--gold:#C9A227;--txt:#eef2f7;--mut:#94a3b8;--bar:#081120;--btn2:#1f3358;--line:#22365c;--side:#081120}
:root[data-theme=light]{--bg:#F8FAFC;--card:#ffffff;--card2:#eef2f7;--txt:#112240;--mut:#5b6b82;--bar:#112240;--btn2:#475569;--line:#d5dde8;--side:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 16px;background:var(--bar);display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 0 12px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button{cursor:pointer;background:var(--acc);border:none}
.tabs button{background:var(--card)} .tabs button.on{background:var(--acc)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;padding:16px 16px 190px}
.st{background:var(--card);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.st:hover{outline:1px solid var(--acc)} .st.playing{outline:2px solid #22c55e}
.st img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#26324f;flex:none}
.st .n{font-weight:bold;white-space:normal;word-break:break-word;line-height:1.4}
.st .m{font-size:12px;color:var(--mut);white-space:normal}
.st .i{flex:1;min-width:0} .fav{background:none;font-size:20px;padding:0 4px;color:#facc15}
#player{position:fixed;bottom:0;left:0;right:0;background:var(--bar);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
#now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{color:var(--mut);font-size:13px}

#byMe,.byAnim{background:linear-gradient(90deg,#fbbf24,#fff7d6,#f59e0b,#fde68a,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 4s linear infinite,pulse 2.5s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fbbf24)}50%{filter:drop-shadow(0 0 6px #fbbf24)}}
.radioIcon{display:inline-block;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}
@media (max-width:600px){header{padding:10px}header input,header select{flex:1 1 45%}#player{gap:6px}#now{flex-basis:100%;order:-1}#vol{display:none}h1{font-size:17px}}
@media (prefers-reduced-motion:reduce){#byMe,.byAnim,.radioIcon{animation:none}}

#moreB{display:none}
html,body{overflow-x:hidden;max-width:100%}
#list{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))!important}
@media (max-width:700px){
  header{position:static;padding:10px 12px;gap:6px}
  header h1{flex-basis:100%;margin:0}
  header input,header select{flex:1 1 40%;min-width:0}
  header button{flex:1 1 auto}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}.tabs button{flex:1 1 auto}
  #masp{flex-wrap:nowrap!important;overflow-x:auto;padding:8px 12px!important}#masp b{white-space:nowrap}#masp button{white-space:nowrap;flex:none}
  #arcBar,#selBar{padding:8px 12px!important}
  #arcBar input,#arcBar select{flex:1 1 100%;min-width:0;max-width:100%}
  #arcBar #ago{flex:1 1 100%}
  #chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;flex-basis:100%}#chips button{white-space:nowrap;flex:none}
  #selBar button{flex:1 1 45%}
  #list{padding:10px 12px 230px!important;gap:8px}
  .st{padding:8px}
  #player{padding:8px 10px;gap:6px;justify-content:space-between}
  #player button,#player select{padding:7px 9px}
  #now{flex:1 1 100%!important;order:-3;font-size:14px;white-space:normal!important}
  #status{order:-2;flex:1 1 100%;font-size:12px}
  #seekBox{order:-1;flex:1 1 100%!important;min-width:0!important}
  #seekBox input{min-width:0}
  #vol{display:none}
  .lbl{display:none}
  #moreB{display:inline-block}
  #player .xtra{display:none!important}
  #player.open .xtra{display:inline-block!important;flex:1 1 45%}
  #player.open #repN{flex:0 0 70px}
  h1{font-size:17px}
}

#fltB,#fmtB,.sh2{display:none}
#filters,#fmts{display:contents}
@media (max-width:700px){
  header h1{flex:1 1 auto!important}
  #fltB{display:inline-block;flex:0 0 auto!important;align-self:center}
  #filters{display:none;flex-wrap:wrap;gap:6px;flex-basis:100%}
  header.fopen #filters{display:flex}
  #filters input,#filters select{flex:1 1 45%;min-width:0}
  #filters button{flex:1 1 45%}
  .lbl2{display:none}.sh2{display:inline}
  .tabs button{padding:8px 6px;font-size:14px}
  #fmtB{display:inline-block;flex:1 1 100%}
  #fmts{display:none}
  #arcBar.fopen #fmts{display:flex;flex-direction:column;gap:6px;flex-basis:100%}
  #player.open .xtra[style*="display: none"],#player.open .xtra[style*="display:none"]{display:none!important}
}

/* ===== القائمة الجانبية ===== */
#side{position:fixed;top:0;right:0;bottom:0;width:300px;background:var(--bar);border-left:1px solid var(--line);overflow-y:auto;z-index:15;padding:10px 10px 120px}
#side .sTitle{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
#side details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card2);overflow:hidden}
#side summary{cursor:pointer;padding:10px 12px;font-weight:bold;list-style:none;display:flex;justify-content:space-between}
#side summary::after{content:'▾';color:var(--mut)}#side details:not([open]) summary::after{content:'◂'}
#side .sBody{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
#side .sBody>*{width:100%}
#side .nav button{text-align:right;background:var(--card)}#side .nav button.on{background:var(--acc)}
#side #masp,#side #arcBar{display:flex!important;flex-direction:column;align-items:stretch!important;background:none!important;padding:0!important;gap:6px}
#side #masp b{display:none}
#side #masp button,#side #arcBar button{text-align:right}
#side #fmts{display:flex!important;flex-direction:column;gap:6px}
#side #chips{display:flex;flex-wrap:wrap;gap:4px}#side #chips button{margin:0!important;flex:1 1 45%}
#side .xtra{display:block!important;width:100%}
#side #repN[style*="display: none"],#side #repN[style*="display:none"]{display:none!important}
#side #fltB,#side #fmtB{display:none!important}
#side #filters{display:flex!important;flex-direction:column;gap:6px}
body.hasSide>header,body.hasSide>#list,body.hasSide>#selBar,body.hasSide>#player{margin-right:300px}
body.hasSide>#player{right:300px;margin-right:0}
#topBar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bar);position:sticky;top:0;z-index:5}
#menuB,#sideClose{display:none;background:var(--btn2)}
#viewTitle{font-weight:bold}
#moreB{display:none!important}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14}
@media (max-width:900px){
  #side{transform:translateX(100%);transition:transform .25s;width:min(320px,86vw)}
  body.sideOpen #side{transform:none}body.sideOpen #overlay{display:block}
  body.hasSide>header,body.hasSide>#list,body.hasSide>#selBar{margin-right:0}
  body.hasSide>#player{right:0}
  #menuB,#sideClose{display:inline-block}
}
@media (max-width:900px){#sleep{flex:0 0 auto;max-width:120px;padding:7px 6px}}

body{font-family:Cairo,Tahoma,Arial,sans-serif}
button{color:#fff}
#side{background:var(--side)!important}
#topBar,#player{color:#fff}
#topBar #themeB{margin-inline-start:auto;background:var(--btn2)}
.tabs button.on,#side .nav button.on{background:var(--acc)!important;color:#fff}
#side .nav button{color:var(--txt)}
:root[data-theme=light] #side .nav button{background:var(--card2)}
:root[data-theme=light] input,:root[data-theme=light] select{background:#fff;color:var(--txt);border-color:var(--line)}
:root[data-theme=light] #player select,:root[data-theme=light] #player input{background:#1f3358;color:#fff}
.st{border:1px solid var(--line)}
.st.playing{outline:2px solid var(--gold)!important}
.st.bad{opacity:.55}.badT{color:#f59e0b}
.ord{display:flex;flex-direction:column;gap:2px}.ord button{padding:2px 8px;background:var(--btn2);font-size:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.tile:hover{border-color:var(--gold)}.tile .tIc{font-size:30px}.tile b{font-size:16px}
.tile.wide{grid-column:1/-1;background:linear-gradient(90deg,var(--acc),#112240);color:#fff}.tile.wide .m{color:#e2e8f0}
.secT{grid-column:1/-1;font-weight:bold;margin-top:8px;color:var(--gold)}
#speed{padding:6px 4px}
#favTools button{background:var(--acc)}
@media (max-width:700px){.tile{padding:12px}.tile .tIc{font-size:24px}}
#topBar #themeB{flex:0 0 auto!important;width:auto}
:root[data-theme=light] #byMe{background:linear-gradient(90deg,#9a7a10,#C9A227,#7a5f0a,#9a7a10);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
:root[data-theme=light] #side h1{color:#112240}
</style>

<body>
<header>
  <h1><span class="radioIcon">📻</span> راديو العالم <small id="byMe" style="font-size:12px;font-weight:normal;color:#fbbf24;cursor:pointer;display:block">إعداد: ASHRAF FATHY</small></h1>

  <span id="filters">
  <input id="q" placeholder="اسم المحطة...">
  <select id="country"><option value="">كل الدول</option></select>
  <select id="lang"><option value="">كل اللغات</option><option value="arabic">عربي</option><option value="english">English</option><option value="french">Français</option><option value="spanish">Español</option><option value="german">Deutsch</option><option value="turkish">Türkçe</option><option value="urdu">اردو</option></select>
  <select id="tag"><option value="">كل الأنواع</option><option value="news">أخبار</option><option value="quran">قرآن</option><option value="music">موسيقى</option><option value="pop">Pop</option><option value="classical">كلاسيك</option><option value="jazz">Jazz</option><option value="sports">رياضة</option><option value="talk">حوارات</option></select>

  </span>

</header>
<div id="masp" style="padding:10px 16px;background:var(--card2);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  <b style="margin-left:6px">📡 إذاعات ماسبيرو الرسمية:</b>
<button data-m="10" style="background:var(--btn2)">البرنامج العام</button><button data-m="9" style="background:var(--btn2)">صوت العرب</button><button data-m="16" style="background:var(--btn2)">الشرق الأوسط</button><button data-m="7" style="background:var(--btn2)">القرآن الكريم</button><button data-m="8" style="background:var(--btn2)">راديو مصر</button><button data-m="11" style="background:var(--btn2)">الشباب والرياضة</button><button data-m="12" style="background:var(--btn2)">البرنامج الثقافي</button><button data-m="13" style="background:var(--btn2)">الأغاني</button><button data-m="14" style="background:var(--btn2)">القاهرة الكبرى</button><button data-m="18" style="background:var(--btn2)">البرنامج الأوروبي</button><button data-m="15" style="background:var(--btn2)">الإذاعات الموجهة</button>
</div>
<div id="arcBar" style="display:none;padding:10px 16px;background:#3b2a1a;gap:6px;flex-wrap:wrap;align-items:center">

  <select id="vfmt" title="صيغة الفيديو"></select></span>

  <label><input type="checkbox" id="selAll"> تحديد الكل</label>
  <span id="selInfo"></span>
  <button id="dirB" style="background:#0e7490">📁 مكان التنزيل: <span id="dirName">لم يُحدد</span></button>
  <button id="dlSel" style="background:#16a34a">⬇ تنزيل المحدد</button>
  <button id="dlStop" style="background:#b91c1c;display:none">⏹ إيقاف التنزيل</button>
  <span id="dlProg" style="font-size:13px"></span>
</div>
<div id="list"></div>
<div id="player">
  <button id="pp">▶</button>
  <span id="seekBox" style="display:none;align-items:center;gap:6px;flex:2;min-width:220px">
    <button id="back30" title="رجوع 30 ثانية" style="background:var(--btn2)">−30 ث</button>
    <span id="tCur" style="font-size:13px">0:00</span>

  <select id="endMode" class="xtra" title="بعد ما الحلقة تخلص"><option value="next">▶ التالي تلقائي</option><option value="stop">⏹ إيقاف بعد النهاية</option><option value="n">🔁 تكرار عدد مرات</option><option value="inf">♾ تكرار بلا حدود</option><option value="all">🔂 تكرار القائمة كلها</option></select>

    <div style="color:#fbbf24;font-size:18px;font-weight:bold;margin:8px 0" class="byAnim">إعداد وتصميم: ASHRAF FATHY</div>

  <div style="font-size:12px;color:var(--mut)">البرنامج لازم يفضل مفتوح والجهاز صاحي.</div>
</div>
<script>
const $=id=>document.getElementById(id), au=$('au');
let API='https://all.api.radio-browser.info', hls=null, current=null, view='all', results=[];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let favs=ls.get('radioFavs',[]);

async function pickServer(){
  for(const s of ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info']){
    try{const r=await fetch(s+'/json/stats',{signal:AbortSignal.timeout(4000)});if(r.ok){API=s;return}}catch{}
  }
}
async function loadCountries(){
  const r=await fetch(API+'/json/countries?order=stationcount&reverse=true&hidebroken=true');
  const c=await r.json();
  $('country').innerHTML+=c.filter(x=>x.stationcount>20).map(x=>`<option value="${x.iso_3166_1}">${x.name} (${x.stationcount})</option>`).join('');
}
async function search(){
  setTab('all');
  $('list').innerHTML='<p>جاري التحميل...</p>';
  const p=new URLSearchParams({limit:($('country').value?1000:300),hidebroken:true,order:'clickcount',reverse:true});
  if($('q').value){p.set('name',$('q').value);p.set('limit',1000)}
  if($('country').value)p.set('countrycode',$('country').value);
  if($('lang').value)p.set('language',$('lang').value);
  if($('tag').value)p.set('tag',$('tag').value);
  try{results=await (await fetch(API+'/json/stations/search?'+p)).json();render(results)}
  catch(e){$('list').innerHTML='<p>تعذر الاتصال بالخادم، تأكد من الإنترنت.</p>'}
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(arr){
  if(!arr.length){$('list').innerHTML='<p>لا توجد محطات.</p>';return}
  $('list').innerHTML=arr.map((s,i)=>`<div class="st ${current&&current.stationuuid===s.stationuuid?'playing':''}" data-i="${i}" data-u="${esc(s.stationuuid)}">
    <img src="${esc(s.favicon)}" onerror="this.style.visibility='hidden'">

// يختار لكل حلقة الصيغة المطلوبة، ولو مش موجودة ياخد الأقرب ليها من تحت، ولو مفيش من تحت ياخد الأقرب من فوق
function pickFiles(files){
  const groups={};
  for(const f of files){
    let ladder=AUD,kind='a',k=AUD.findIndex(x=>x[0]===f.format);
    if(k<0){k=VID.findIndex(x=>x[0]===f.format);ladder=VID;kind='v'}
    if(k<0)continue;
    const base=f.name.replace(/\.[^.\/]+$/,'').replace(/(_64kb|_128kb|_vbr|_512kb|\.ia|_hd)$/i,'')+'|'+kind;
    (groups[base]=groups[base]||[]).push({...f,k,kind});
  }
  const out=[];
  for(const [base,arr] of Object.entries(groups)){
    const pref=+(arr[0].kind==='a'?$('afmt').value:$('vfmt').value);
    const below=arr.filter(x=>x.k>=pref).sort((a,b)=>a.k-b.k)[0];
    const above=arr.filter(x=>x.k<pref).sort((a,b)=>b.k-a.k)[0];
    const f=below||above;
    out.push({...f,exact:f.k===pref,fmtLabel:(f.kind==='a'?AUD:VID)[f.k][1]});
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ar',{numeric:true}));
}

async function downloadJobs(jobs){
  if(dlAbort){alert('فيه تنزيل شغال، استنى يخلص أو اوقفه');return}
  const useFS='showDirectoryPicker' in window;
  if(useFS){if(!await ensureDir())return}
  dlAbort=new AbortController();$('dlStop').style.display='';
  let done=0,skipped=0,failed=0,bytes=0;const total=jobs.reduce((a,x)=>a+x.size,0);
  for(const it of jobs){
    if(dlAbort.signal.aborted)break;
    const fname=cleanName(it.file.split('/').pop());
    const show=got=>$('dlProg').textContent=`${done+skipped+failed+1}/${jobs.length} · ${it.name.slice(0,40)} · ${gb(bytes+got)} من ${gb(total)}`;
    try{
      if(useFS){
        const folder=await dirHandle.getDirectoryHandle(cleanName(it.country)||'archive',{create:true});
        try{const ex=await (await folder.getFileHandle(fname)).getFile();if(it.size&&ex.size===it.size){skipped++;bytes+=it.size;continue}}catch{}
        const r=await fetch(it.url_resolved,{signal:dlAbort.signal});if(!r.ok)throw 0;
        const fh=await folder.getFileHandle(fname+'.part',{create:true}),w=await fh.createWritable();
        const rd=r.body.getReader();let got=0;
        for(;;){const {done:d,value}=await rd.read();if(d)break;await w.write(value);got+=value.length;if(got%(1<<20)<value.length)show(got)}
        await w.close();
        if(fh.move)await fh.move(fname);else{const f2=await folder.getFileHandle(fname,{create:true}),w2=await f2.createWritable();await w2.write(await fh.getFile());await w2.close();await folder.removeEntry(fname+'.part')}
        bytes+=got;
      }else{
        show(0);const b=await (await fetch(it.url_resolved,{signal:dlAbort.signal})).blob();
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cleanName(it.country+' - '+fname);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);bytes+=b.size;
      }
      done++;
    }catch(e){if(dlAbort.signal.aborted)break;failed++}
  }
  const stopped=dlAbort.signal.aborted;dlAbort=null;$('dlStop').style.display='none';
  $('dlProg').textContent=`${stopped?'⏹ اتوقف':'✔ خلص'} — اتنزل ${done}، موجود قبل كده ${skipped}${failed?`، فشل ${failed}`:''}`;
}

const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('radioApp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{const tx=r.result.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};r.onerror=()=>rej(r.error)});
async function chooseDir(){try{const h=await showDirectoryPicker({mode:'readwrite',id:'radioArchive'});dirHandle=h;await idb('readwrite',st=>st.put(h,'dir'));$('dirName').textContent=h.name;return true}catch{return false}}
async function ensureDir(){
  if(!dirHandle){$('status').textContent='اختار مكان التنزيل';return chooseDir()}
  try{let p=await dirHandle.queryPermission({mode:'readwrite'});if(p!=='granted')p=await dirHandle.requestPermission({mode:'readwrite'});if(p!=='granted')return chooseDir();
    for await(const _ of dirHandle.keys())break;return true}
  catch{alert(`مش قادر أوصل للفولدر «${dirHandle.name}».\nلو هارد خارجي اتأكد إنه متوصل، أو اختار مكان تاني.`);return chooseDir()}
}
$('dirB').onclick=()=>chooseDir();
if('showDirectoryPicker' in window)idb('readonly',st=>st.get('dir')).then(h=>{if(h){dirHandle=h;$('dirName').textContent=h.name}}).catch(()=>{});
else $('dirB').style.display='none';

/* ===== التنقل والتكرار ===== */
let playlist=[],playCtx=null,repLeft=0;
function markPlaying(){$('list').querySelectorAll('.st.playing').forEach(e=>e.classList.remove('playing'));
  if(current)$('list').querySelectorAll('.st[data-u]').forEach(e=>{if(e.dataset.u===current.stationuuid)e.classList.add('playing')})}
const curIdx=()=>current?playlist.findIndex(x=>x.stationuuid===current.stationuuid):-1;
function playAt(i,keepRep){if(i<0||i>=playlist.length)return false;if(!keepRep)repLeft=0;playMedia(playlist[i]);markPlaying();return true}
$('prevB').onclick=()=>{const i=curIdx();if(i>0)playAt(i-1);else $('status').textContent='ده أول عنصر'};
$('nextB').onclick=()=>{const i=curIdx();if(i>=0&&i<playlist.length-1)playAt(i+1);else $('status').textContent='ده آخر عنصر'};
$('locB').onclick=async()=>{
  if(!current)return;
  const go=()=>{const el=[...$('list').querySelectorAll('.st[data-u]')].find(e=>e.dataset.u===current.stationuuid);if(el){markPlaying();el.scrollIntoView({behavior:'smooth',block:'center'});el.animate([{outline:'4px solid #facc15'},{outline:'2px solid #22c55e'}],{duration:1500});return true}};
  if(go())return;
  if(String(current.stationuuid).startsWith('ia:')&&playCtx){setTab('arc');await arcOpen(playCtx.id,playCtx.title);go()}
  else if(playlist.length){setTab(playlist===favs?'fav':'all');render(playlist);go()}
};
try{const m=localStorage.getItem('endMode');if(m)$('endMode').value=m;const n=localStorage.getItem('repN');if(n)$('repN').value=n}catch{}
const showRep=()=>$('repN').style.display=$('endMode').value==='n'?'':'none';showRep();
$('endMode').onchange=()=>{showRep();repLeft=0;try{localStorage.setItem('endMode',$('endMode').value)}catch{}};
$('repN').onchange=()=>{repLeft=0;try{localStorage.setItem('repN',$('repN').value)}catch{}};
function onEnd(el){
  const m=$('endMode').value,i=curIdx();
  if(m==='stop'){$('status').textContent='خلصت ⏹';return}
  if(m==='inf'){el.currentTime=0;el.play();return}
  if(m==='n'){if(repLeft===0)repLeft=Math.max(1,+$('repN').value);repLeft--;
    if(repLeft>0){el.currentTime=0;el.play();$('status').textContent=`تكرار — باقي ${repLeft}`;return}
    $('status').textContent='خلص التكرار ⏹';return}
  if(i>=0&&i<playlist.length-1){playAt(i+1);return}
  if(m==='all'&&playlist.length){playAt(0);return}
  $('status').textContent='خلصت القائمة';
}
au.addEventListener('ended',()=>onEnd(au));
$('vid').addEventListener('ended',()=>onEnd($('vid')));


$('now').onclick=()=>$('locB').click();
$('upB').onclick=async()=>{
  if(!current)return;
  if(String(current.stationuuid).startsWith('ia:')&&playCtx){
    setTab('arc');
    if(!arcState.docs.length||arcState.mode!=='search')await arcSearch();
    const el=[...$('list').querySelectorAll('.st[data-id]')].find(e=>e.dataset.id===playCtx.id);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('playing')}
    else $('status').textContent='المجموعة مش ضمن نتايج البحث الحالية';
  }else{setTab(playlist===favs?'fav':'all');render(playlist.length?playlist:results);$('locB').click()}
};

/* ===== شريط التقديم للأرشيف ===== */
const fmt=t=>{t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(t%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
let seeking=false;
const upd=()=>{const ok=isFinite(au.duration)&&au.duration>0;$('seekBox').style.display=ok?'flex':'none';if(!ok)return;
  $('seek').max=Math.floor(au.duration);$('tDur').textContent=fmt(au.duration);
  if(!seeking){$('seek').value=Math.floor(au.currentTime);$('tCur').textContent=fmt(au.currentTime)}};
au.addEventListener('loadedmetadata',upd);au.addEventListener('durationchange',upd);au.addEventListener('timeupdate',upd);au.addEventListener('emptied',upd);
$('seek').oninput=e=>{seeking=true;$('tCur').textContent=fmt(e.target.value)};
$('seek').onchange=e=>{au.currentTime=+e.target.value;seeking=false};
$('back30').onclick=()=>au.currentTime=Math.max(0,au.currentTime-30);
$('fwd30').onclick=()=>au.currentTime=Math.min(au.duration,au.currentTime+30);

$('byMe').onclick=()=>$('aboutBox').style.display='flex';
$('aboutClose').onclick=()=>$('aboutBox').style.display='none';
$('aboutBox').onclick=e=>{if(e.target.id==='aboutBox')e.target.style.display='none'};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(/Android|iPhone|iPad/i.test(navigator.userAgent))$('rec').style.display='none';
$('fltB').onclick=()=>{const h=document.querySelector('header');h.classList.toggle('fopen');$('fltB').textContent=h.classList.contains('fopen')?'✕ إخفاء البحث':'🔍 بحث وفلاتر'};
$('fmtB').onclick=()=>{$('arcBar').classList.toggle('fopen')};
$('moreB').onclick=()=>{$('player').classList.toggle('open');$('moreB').textContent=$('player').classList.contains('open')?'✕ إغلاق':'⚙️ خيارات'};

/* ===== بناء القائمة الجانبية ===== */
(function(){
  const side=document.createElement('aside');side.id='side';
  const sec=(title,open,...els)=>{const d=document.createElement('details');if(open)d.open=true;d.innerHTML=`<summary>${title}</summary><div class="sBody"></div>`;const b=d.querySelector('.sBody');els.forEach(e=>e&&b.appendChild(e));side.appendChild(d);return d};
  const hdr=document.querySelector('header');
  side.innerHTML=`<div class="sTitle"><div>${hdr.querySelector('h1').outerHTML}</div><button id="sideClose">✕</button></div>`;
  hdr.querySelector('h1').remove();
  const nav=document.createElement('div');nav.className='nav';nav.style.cssText='display:flex;flex-direction:column;gap:6px';
  ['tAll','tFav','tArc'].forEach(id=>nav.appendChild($(id)));
  sec('📂 الأقسام',true,nav);
  sec('🔍 بحث المحطات',false,$('filters'));
  sec('📡 إذاعات ماسبيرو الرسمية',false,$('masp'));
  sec('🎭 بحث الأرشيف والصيغ',false,$('arcBar'));
  const play=document.createElement('div');play.style.cssText='display:flex;flex-direction:column;gap:6px';
  ['upB','endMode','repN','alarmBtn','rec'].forEach(id=>$(id)&&play.appendChild($(id)));
  sec('⚙️ التشغيل والتكرار والمنبّه',false,play);
  document.body.appendChild(side);
  const ov=document.createElement('div');ov.id='overlay';document.body.appendChild(ov);
  hdr.innerHTML='';hdr.id='topBar';hdr.innerHTML='<button id="menuB">☰ القائمة</button><span id="viewTitle">📻 المحطات</span>';
  document.body.classList.add('hasSide');
  const close=()=>document.body.classList.remove('sideOpen');
  $('menuB').onclick=()=>document.body.classList.add('sideOpen');
  $('sideClose').onclick=close;ov.onclick=close;
  side.addEventListener('click',e=>{if(innerWidth<=900&&e.target.closest('.nav button,#masp [data-m],#chips [data-c],#ago,#go,#eg'))close()});
  if($('byMe'))$('byMe').onclick=()=>$('aboutBox').style.display='flex';
  // اسم البرنامج في العنوان الثابت
  $('alarmBox').style.zIndex=31;
})();


/* ===== زرار الرجوع (الموبايل والمتصفح) ===== */
(function(){
  const deep=()=>({vid:$('vidBox').style.display==='flex',about:$('aboutBox').style.display==='flex',alarm:$('alarmBox').style.display==='block',side:document.body.classList.contains('sideOpen'),item:view==='arc'&&arcState.mode==='item',tab:view!=='home'});
  const isRoot=()=>{const d=deep();return !(d.vid||d.about||d.alarm||d.side||d.item||d.tab)};
  window.navPush=()=>{try{history.pushState({r:1},'')}catch{}updBack()};
  function goBack(){
    const d=deep();
    if(d.vid){$('vidClose').click()}
    else if(d.about){$('aboutBox').style.display='none'}
    else if(d.alarm){$('alarmBox').style.display='none'}
    else if(d.side){document.body.classList.remove('sideOpen')}
    else if(d.item){arcSearch()}
    else if(d.tab){showHome()}
    updBack();
  }
  function updBack(){const b=$('backB');if(b)b.style.display=isRoot()?'none':'inline-block'}
  window.updBack=updBack;
  addEventListener('popstate',()=>{goBack();if(!isRoot())try{history.pushState({r:1},'')}catch{}});
  const bb=document.createElement('button');bb.id='backB';bb.textContent='→ رجوع';bb.style.cssText='background:var(--btn2);display:none';
  const tb=$('topBar');if(tb)tb.insertBefore(bb,tb.firstChild);
  bb.onclick=()=>{goBack();};
  // كل ما تدخل مستوى أعمق نسجّل خطوة في السجل
  $('menuB').addEventListener('click',navPush);
  ['tAll','tFav','tArc'].forEach(id=>$(id).addEventListener('click',navPush));
  $('list').addEventListener('click',e=>{if(view==='arc'&&arcState.mode==='search'&&e.target.closest('[data-id]')&&!e.target.classList.contains('sel'))navPush()},true);
  const vo=new MutationObserver(updBack);['vidBox','aboutBox','alarmBox'].forEach(id=>vo.observe($(id),{attributes:true,attributeFilter:['style']}));
  new MutationObserver(updBack).observe(document.body,{attributes:true,attributeFilter:['class']});
  setInterval(updBack,1500);
  history.replaceState({root:1},'');
})();

/* ===== مزايا إضافية ===== */
// --- الأقسام الجديدة: الرئيسية + آخر ما سمعته ---
let recent=ls.get('radioRecent',[]),bad=new Set(ls.get('radioBad',[]));
const TABS={home:'tHome',all:'tAll',fav:'tFav',arc:'tArc',rec:'tRec'},TT={home:'🏠 الرئيسية',all:'📻 المحطات',fav:'⭐ المفضلة',arc:'🎭 أرشيف المسرحيات والسهرات',rec:'🕘 آخر ما سمعته'};
setTab=function(t){view=t;if($('viewTitle'))$('viewTitle').textContent=TT[t];Object.entries(TABS).forEach(([k,id])=>$(id)&&$(id).classList.toggle('on',k===t));if(t!=='arc')$('selBar').style.display='none';$('favTools')&&($('favTools').style.display=t==='fav'?'flex':'none')};
const slim=s=>({stationuuid:s.stationuuid,name:s.name,country:s.country,tags:s.tags,favicon:s.favicon,url_resolved:s.url_resolved,url:s.url,bitrate:s.bitrate,hls:s.hls,video:s.video,id:s.id,file:s.file,size:s.size});
function addRecent(s){recent=[slim(s),...recent.filter(r=>r.stationuuid!==s.stationuuid)].slice(0,20);ls.set('radioRecent',recent)}
function showHome(){
  setTab('home');
  const tile=(ic,t,sub,act)=>`<div class="tile" data-act="${act}"><div class="tIc">${ic}</div><div><b>${t}</b><div class="m">${sub}</div></div></div>`;
  const last=ls.get('radioLast',null);
  $('list').innerHTML=
   (last?`<div class="tile wide" data-act="resume"><div class="tIc">▶</div><div><b>كمّل: ${esc(last.item.name)}</b><div class="m">${esc(last.item.country||'')}${last.t>5?' · من '+fmt(last.t):''}</div></div></div>`:'')+
   tile('⭐','المفضلة',favs.length+' عنصر','fav')+
   tile('🕘','آخر ما سمعته',recent.length+' عنصر','rec')+
   tile('🇪🇬','محطات مصر','كل الإذاعات المصرية','eg')+
   tile('📡','إذاعات ماسبيرو','البرنامج العام، صوت العرب...','masp')+
   tile('🎭','أرشيف المسرحيات','مسرحيات وسهرات ومسلسلات','arc')+
   tile('🌍','كل المحطات','بحث بالدولة واللغة','all')+
   (recent.length?`<div class="secT">🕘 سمعتهم مؤخراً</div>`+recent.slice(0,6).map((r,i)=>`<div class="st" data-ri="${i}" data-u="${esc(r.stationuuid)}"><div style="font-size:24px">${String(r.stationuuid).startsWith('ia:')?(r.video?'🎬':'🎭'):'📻'}</div><div class="i"><div class="n">${esc(r.name)}</div><div class="m">${esc(r.country||'')}</div></div></div>`).join(''):'');
  $('list').onclick=e=>{
    const r=e.target.closest('[data-ri]');if(r){playlist=recent;playMedia(recent[r.dataset.ri]);return}
    const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;navPush();
    if(a==='resume')resume();
    else if(a==='fav'){setTab('fav');render(favs)}
    else if(a==='rec'){setTab('rec');render(recent)}
    else if(a==='eg')$('eg').click();
    else if(a==='all'){setTab('all');results.length?render(results):search()}
    else if(a==='arc')$('tArc').click();
    else if(a==='masp'){document.body.classList.add('sideOpen');const d=[...document.querySelectorAll('#side details')].find(d=>d.querySelector('#masp'));if(d){d.open=true;d.scrollIntoView()}}
  };
  markPlaying();
}
(function(){
  const nav=$('tAll').parentNode;
  const h=document.createElement('button');h.id='tHome';h.textContent='🏠 الرئيسية';nav.insertBefore(h,nav.firstChild);
  const r=document.createElement('button');r.id='tRec';r.textContent='🕘 آخر ما سمعته';nav.insertBefore(r,$('tArc'));
  h.onclick=()=>{navPush();showHome()};r.onclick=()=>{navPush();setTab('rec');render(recent)};
  $('tAll').onclick=()=>{setTab('all');results.length?render(results):search()};
  $('tFav').onclick=()=>{setTab('fav');render(favs)};
})();
// --- المحطات اللي ما اشتغلتش + مهلة تحميل ---
let loadTimer=null;
function markBad(s,on){if(!s||String(s.stationuuid).startsWith('ia:'))return;on?bad.add(s.stationuuid):bad.delete(s.stationuuid);ls.set('radioBad',[...bad])}
const _play=play;
play=function(s){_play(s);addRecent(s);saveLast(0);setMeta(s);clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{if(current===s&&(au.paused||au.readyState<3)){$('status').textContent='⚠️ المحطة دي مش بترد، جرّب غيرها';markBad(s,true);markPlaying()}},15000);
  au.playbackRate=String(s.stationuuid).startsWith('ia:')?+$('speed').value:1};
au.addEventListener('playing',()=>{clearTimeout(loadTimer);markBad(current,false);if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'});
au.addEventListener('pause',()=>{if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'});
au.addEventListener('error',()=>{clearTimeout(loadTimer);$('status').textContent='⚠️ المحطة دي مش شغالة دلوقتي، جرّب غيرها';markBad(current,true)});
// --- تزيين القوائم: علامة المحطات المعطلة + ترتيب المفضلة ---
const _render=render;
render=function(arr){_render(arr);
  $('list').querySelectorAll('.st[data-u]').forEach(el=>{if(bad.has(el.dataset.u)){el.classList.add('bad');const m=el.querySelector('.m');m&&m.insertAdjacentHTML('afterbegin','<span class="badT">⚠️ ما اشتغلتش آخر مرة · </span>')}});
  if(view==='fav'&&arr===favs){$('list').querySelectorAll('.st[data-i]').forEach(el=>{const i=+el.dataset.i;el.insertAdjacentHTML('beforeend',`<span class="ord"><button data-up="${i}" title="لفوق">▲</button><button data-dn="${i}" title="لتحت">▼</button></span>`)})}
};
$('list').addEventListener('click',e=>{const u=e.target.closest('[data-up],[data-dn]');if(!u||view!=='fav')return;e.stopPropagation();
  const i=+(u.dataset.up??u.dataset.dn),j=u.dataset.up!=null?i-1:i+1;if(j<0||j>=favs.length)return;[favs[i],favs[j]]=[favs[j],favs[i]];ls.set('radioFavs',favs);render(favs)},true);
// --- نسخ احتياطي للمفضلة ---
(function(){
  const box=document.createElement('div');box.id='favTools';box.style.cssText='display:none;gap:8px;flex-wrap:wrap;padding:10px 16px';
  box.innerHTML='<button id="favExp">⬇ حفظ نسخة من المفضلة</button><button id="favImp">⬆ استرجاع نسخة</button><input type="file" id="favFile" accept=".json" style="display:none"><span class="m" style="align-self:center">رتّب بالأسهم ▲▼</span>';
  $('list').parentNode.insertBefore(box,$('list'));
  $('favExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'ASHRAF FATHY RADIO',favs,recent},null,1)],{type:'application/json'}));a.download='ASHRAF-FATHY-RADIO-favorites.json';a.click()};
  $('favImp').onclick=()=>$('favFile').click();
  $('favFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());const add=(d.favs||[]).filter(x=>!favs.some(f=>f.stationuuid===x.stationuuid));favs.push(...add);ls.set('radioFavs',favs);render(favs);$('status').textContent=`اتضاف ${add.length} للمفضلة ✔`}catch{alert('الملف ده مش نسخة مفضلة صحيحة')}e.target.value=''};
})();
// --- يفتكر آخر حاجة + يكمّل من مكانه ---
function saveLast(t){if(current)ls.set('radioLast',{item:slim(current),t:String(current.stationuuid).startsWith('ia:')?(t??au.currentTime):0})}
let lastSave=0;au.addEventListener('timeupdate',()=>{if(Date.now()-lastSave>5000){lastSave=Date.now();saveLast()}});
function resume(){const l=ls.get('radioLast',null);if(!l)return;playlist=[l.item];playMedia(l.item);
  if(l.t>5)au.addEventListener('loadedmetadata',function f(){au.currentTime=l.t;au.removeEventListener('loadedmetadata',f)})}
$('pp').onclick=()=>{if(!current){resume();return}au.paused?au.play():au.pause()};
(function(){const l=ls.get('radioLast',null);if(l)$('now').textContent='▶ كمّل: '+l.item.name})();
// --- شاشة القفل وأزرار السماعة ---
function setMeta(s){if(!('mediaSession'in navigator))return;try{
  navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:s.country||'',album:'ASHRAF FATHY RADIO',artwork:[{src:s.favicon||new URL('icon-512.png',location.href).href,sizes:'512x512'}]})}catch{}}
if('mediaSession'in navigator){const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f)}catch{}};
  h('play',()=>au.play());h('pause',()=>au.pause());h('nexttrack',()=>$('nextB').click());h('previoustrack',()=>$('prevB').click());
  h('seekforward',()=>au.currentTime+=30);h('seekbackward',()=>au.currentTime-=30);h('seekto',d=>{if(isFinite(au.duration))au.currentTime=d.seekTime})}
// --- سرعة التشغيل ---
(function(){const sp=document.createElement('select');sp.id='speed';sp.title='سرعة التشغيل';
  sp.innerHTML=[0.75,1,1.25,1.5,1.75,2].map(v=>`<option value="${v}">${v}x</option>`).join('');sp.value=ls.get('radioSpeed',1);
  $('seekBox').appendChild(sp);sp.onchange=()=>{au.playbackRate=$('vid').playbackRate=+sp.value;ls.set('radioSpeed',sp.value)};
  $('vid').addEventListener('play',()=>$('vid').playbackRate=+sp.value)})();
// --- الوضع الفاتح/الغامق ---
(function(){const b=document.createElement('button');b.id='themeB';b.title='فاتح / غامق';
  const apply=t=>{document.documentElement.dataset.theme=t;b.textContent=t==='light'?'🌙':'☀️';ls.set('radioTheme',t)};
  apply(ls.get('radioTheme','dark'));b.onclick=()=>apply(document.documentElement.dataset.theme==='light'?'dark':'light');
  $('topBar').appendChild(b)})();

// --- زرار الخروج ---
(function(){const b=document.createElement('button');b.id='exitB';b.textContent='خروج';b.style.cssText='background:#b91c1c;flex:0 0 auto;font-weight:bold';
  $('topBar').appendChild(b);
  const dlg=document.createElement('div');dlg.id='exitDlg';
  dlg.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;align-items:center;justify-content:center';
  dlg.innerHTML='<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(300px,85vw);text-align:center;color:var(--txt)"><b style="font-size:18px">خروج؟</b><div style="display:flex;gap:10px;margin-top:18px"><button id="exitYes" style="flex:1;background:#b91c1c;padding:10px">خروج</button><button id="exitNo" style="flex:1;background:var(--btn2);padding:10px">إلغاء</button></div></div>';
  document.body.appendChild(dlg);
  b.onclick=()=>dlg.style.display='flex';
  $('exitNo').onclick=()=>dlg.style.display='none';
  dlg.onclick=e=>{if(e.target===dlg)dlg.style.display='none'};
  $('exitYes').onclick=()=>{
    try{au.pause();au.removeAttribute('src');au.load();$('vid').pause()}catch{}sleepAt=0;
    window.close();
    setTimeout(()=>{document.body.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px"><div style="font-size:44px">📻</div><b style="font-size:20px">تم الخروج</b><button onclick="location.reload()" style="background:#0F766E;padding:10px 24px">فتح</button></div>';
      try{history.replaceState(null,'')}catch{}},300)}})();

(async()=>{await pickServer();loadCountries().catch(()=>{});$('lang').value='arabic';showHome()})();
</script>
