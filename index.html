<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>راديو العالم — ASHRAF FATHY</title>
<meta name="author" content="ASHRAF FATHY">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="var(--bar)">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- راديو العالم | إعداد وتصميم: ASHRAF FATHY | جميع الحقوق محفوظة © 2026 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
:root{--bg:#0a1628;--card:#112240;--card2:#0e1d38;--acc:#0F766E;--gold:#C9A227;--txt:#eef2f7;--mut:#94a3b8;--bar:#081120;--btn2:#1f3358;--line:#22365c;--side:#081120}
:root[data-theme=light]{--bg:#F8FAFC;--card:#ffffff;--card2:#eef2f7;--txt:#112240;--mut:#5b6b82;--bar:#112240;--btn2:#475569;--line:#d5dde8;--side:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 16px;background:var(--bar);display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 0 12px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button{cursor:pointer;background:var(--acc);border:none}
.tabs button{background:var(--card)} .tabs button.on{background:var(--acc)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;padding:16px 16px 190px}
.st{background:var(--card);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.st:hover{outline:1px solid var(--acc)} .st.playing{outline:2px solid #22c55e}
.st img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#26324f;flex:none}
.st .n{font-weight:bold;white-space:normal;word-break:break-word;line-height:1.4}
.st .m{font-size:12px;color:var(--mut);white-space:normal}
.st .i{flex:1;min-width:0} .fav{background:none;font-size:20px;padding:0 4px;color:#facc15}
#player{position:fixed;bottom:0;left:0;right:0;background:var(--bar);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
#now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{color:var(--mut);font-size:13px}

#byMe,.byAnim{background:linear-gradient(90deg,#fbbf24,#fff7d6,#f59e0b,#fde68a,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 4s linear infinite,pulse 2.5s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fbbf24)}50%{filter:drop-shadow(0 0 6px #fbbf24)}}
.radioIcon{display:inline-block;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}
@media (max-width:600px){header{padding:10px}header input,header select{flex:1 1 45%}#player{gap:6px}#now{flex-basis:100%;order:-1}#vol{display:none}h1{font-size:17px}}
@media (prefers-reduced-motion:reduce){#byMe,.byAnim,.radioIcon{animation:none}}

#moreB{display:none}
html,body{overflow-x:hidden;max-width:100%}
#list{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))!important}
@media (max-width:700px){
  header{position:static;padding:10px 12px;gap:6px}
  header h1{flex-basis:100%;margin:0}
  header input,header select{flex:1 1 40%;min-width:0}
  header button{flex:1 1 auto}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}.tabs button{flex:1 1 auto}
  #masp{flex-wrap:nowrap!important;overflow-x:auto;padding:8px 12px!important}#masp b{white-space:nowrap}#masp button{white-space:nowrap;flex:none}
  #arcBar,#selBar{padding:8px 12px!important}
  #arcBar input,#arcBar select{flex:1 1 100%;min-width:0;max-width:100%}
  #arcBar #ago{flex:1 1 100%}
  #chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;flex-basis:100%}#chips button{white-space:nowrap;flex:none}
  #selBar button{flex:1 1 45%}
  #list{padding:10px 12px 230px!important;gap:8px}
  .st{padding:8px}
  #player{padding:8px 10px;gap:6px;justify-content:space-between}
  #player button,#player select{padding:7px 9px}
  #now{flex:1 1 100%!important;order:-3;font-size:14px;white-space:normal!important}
  #status{order:-2;flex:1 1 100%;font-size:12px}
  #seekBox{order:-1;flex:1 1 100%!important;min-width:0!important}
  #seekBox input{min-width:0}
  #vol{display:none}
  .lbl{display:none}
  #moreB{display:inline-block}
  #player .xtra{display:none!important}
  #player.open .xtra{display:inline-block!important;flex:1 1 45%}
  #player.open #repN{flex:0 0 70px}
  h1{font-size:17px}
}

#fltB,#fmtB,.sh2{display:none}
#filters,#fmts{display:contents}
@media (max-width:700px){
  header h1{flex:1 1 auto!important}
  #fltB{display:inline-block;flex:0 0 auto!important;align-self:center}
  #filters{display:none;flex-wrap:wrap;gap:6px;flex-basis:100%}
  header.fopen #filters{display:flex}
  #filters input,#filters select{flex:1 1 45%;min-width:0}
  #filters button{flex:1 1 45%}
  .lbl2{display:none}.sh2{display:inline}
  .tabs button{padding:8px 6px;font-size:14px}
  #fmtB{display:inline-block;flex:1 1 100%}
  #fmts{display:none}
  #arcBar.fopen #fmts{display:flex;flex-direction:column;gap:6px;flex-basis:100%}
  #player.open .xtra[style*="display: none"],#player.open .xtra[style*="display:none"]{display:none!important}
}

/* ===== القائمة الجانبية ===== */
#side{position:fixed;top:0;right:0;bottom:0;width:300px;background:var(--bar);border-left:1px solid var(--line);overflow-y:auto;z-index:15;padding:10px 10px 120px}
#side .sTitle{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
#side details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card2);overflow:hidden}
#side summary{cursor:pointer;padding:10px 12px;font-weight:bold;list-style:none;display:flex;justify-content:space-between}
#side summary::after{content:'▾';color:var(--mut)}#side details:not([open]) summary::after{content:'◂'}
#side .sBody{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
#side .sBody>*{width:100%}
#side .nav button{text-align:right;background:var(--card)}#side .nav button.on{background:var(--acc)}
#side #masp,#side #arcBar{display:flex!important;flex-direction:column;align-items:stretch!important;background:none!important;padding:0!important;gap:6px}
#side #masp b{display:none}
#side #masp button,#side #arcBar button{text-align:right}
#side #fmts{display:flex!important;flex-direction:column;gap:6px}
#side #chips{display:flex;flex-wrap:wrap;gap:4px}#side #chips button{margin:0!important;flex:1 1 45%}
#side .xtra{display:block!important;width:100%}
#side #repN[style*="display: none"],#side #repN[style*="display:none"]{display:none!important}
#side #fltB,#side #fmtB{display:none!important}
#side #filters{display:flex!important;flex-direction:column;gap:6px}
body.hasSide>header,body.hasSide>#list,body.hasSide>#selBar,body.hasSide>#player{margin-right:300px}
body.hasSide>#player{right:300px;margin-right:0}
#topBar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bar);position:sticky;top:0;z-index:5}
#menuB,#sideClose{display:none;background:var(--btn2)}
#viewTitle{font-weight:bold}
#moreB{display:none!important}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14}
@media (max-width:900px){
  #side{transform:translateX(100%);transition:transform .25s;width:min(320px,86vw)}
  body.sideOpen #side{transform:none}body.sideOpen #overlay{display:block}
  body.hasSide>header,body.hasSide>#list,body.hasSide>#selBar{margin-right:0}
  body.hasSide>#player{right:0}
  #menuB,#sideClose{display:inline-block}
}
@media (max-width:900px){#sleep{flex:0 0 auto;max-width:120px;padding:7px 6px}}

body{font-family:Cairo,Tahoma,Arial,sans-serif}
button{color:#fff}
#side{background:var(--side)!important}
#topBar,#player{color:#fff}
#topBar #themeB{margin-inline-start:auto;background:var(--btn2)}
.tabs button.on,#side .nav button.on{background:var(--acc)!important;color:#fff}
#side .nav button{color:var(--txt)}
:root[data-theme=light] #side .nav button{background:var(--card2)}
:root[data-theme=light] input,:root[data-theme=light] select{background:#fff;color:var(--txt);border-color:var(--line)}
:root[data-theme=light] #player select,:root[data-theme=light] #player input{background:#1f3358;color:#fff}
.st{border:1px solid var(--line)}
.st.playing{outline:2px solid var(--gold)!important}
.st.bad{opacity:.55}.badT{color:#f59e0b}
.ord{display:flex;flex-direction:column;gap:2px}.ord button{padding:2px 8px;background:var(--btn2);font-size:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.tile:hover{border-color:var(--gold)}.tile .tIc{font-size:30px}.tile b{font-size:16px}
.tile.wide{grid-column:1/-1;background:linear-gradient(90deg,var(--acc),#112240);color:#fff}.tile.wide .m{color:#e2e8f0}
.secT{grid-column:1/-1;font-weight:bold;margin-top:8px;color:var(--gold)}
#speed{padding:6px 4px}
#favTools button{background:var(--acc)}
@media (max-width:700px){.tile{padding:12px}.tile .tIc{font-size:24px}}
#topBar #themeB{flex:0 0 auto!important;width:auto}
:root[data-theme=light] #byMe{background:linear-gradient(90deg,#9a7a10,#C9A227,#7a5f0a,#9a7a10);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
:root[data-theme=light] #side h1{color:#112240}
#maspBox{display:none;position:relative;width:64px;height:64px;flex:0 0 64px;border-radius:10px;overflow:hidden;border:2px solid var(--gold);background:#000}
#maspBox iframe{position:absolute;top:0;left:50%;height:100%;width:178%;transform:translateX(-50%);border:0}
#maspTap{position:absolute;inset:0;cursor:zoom-in}
#maspX{position:absolute;top:2px;left:2px;padding:0 5px!important;font-size:11px;line-height:16px;background:#b91c1c;border-radius:6px;z-index:2}
#maspZ{position:absolute;top:2px;right:2px;padding:0 5px!important;font-size:11px;line-height:16px;background:var(--btn2);border-radius:6px;z-index:2}
#maspBox.big #maspZ{top:6px;right:6px;font-size:14px;padding:2px 8px!important}
#maspName{display:none}
#maspBox.big{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,720px);height:min(80vh,620px);z-index:45;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#maspBox.big iframe{width:100%;left:0;transform:none}
#maspBox.big #maspTap{display:none}
#maspBox.big #maspX{top:6px;left:6px;font-size:14px;padding:2px 8px!important}
@media (max-width:700px){#topBar{gap:6px;flex-wrap:nowrap}#topBar button{padding:8px 10px;flex:0 0 auto}#viewTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}}
#gBar{display:flex;gap:8px;padding:8px 16px;background:var(--bar);position:sticky;top:58px;z-index:5}
#gBar input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:10px}
#gBar button{background:var(--acc);padding:0 18px}
a.ext{background:var(--btn2);color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none}
#topBar{position:sticky;top:0;z-index:6}
body.hasSide>#gBar{margin-right:300px}
@media (max-width:900px){body.hasSide>#gBar{margin-right:0}}
@media (max-width:700px){#gBar{padding:6px 12px;top:56px}}
#prBox{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
#prMore{flex-direction:column;gap:8px}.prRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.prRow input[type=number]{width:60px}
.prTimes{display:flex;flex-wrap:wrap;gap:6px}.prTimes span{background:var(--card2);padding:4px 8px;border-radius:8px;font-size:13px}
@media (max-width:900px){#side #rec{display:none!important}}
#npBox{display:none;position:fixed;inset:0;z-index:35;background:linear-gradient(180deg,#112240,#081120);color:#fff;align-items:center;justify-content:center}
.npIn{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(420px,90vw);text-align:center}
.npX{position:absolute;top:14px;right:14px;font-size:22px;background:var(--btn2)}
#npArt{width:min(220px,55vw);height:min(220px,55vw);border-radius:24px;background:#1f3358;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden;border:2px solid var(--gold)}
#npArt img{width:100%;height:100%;object-fit:cover}
#npName{font-size:24px;font-weight:bold}
.npCtl{display:flex;gap:18px;margin-top:10px}.npCtl button{font-size:28px;width:70px;height:70px;border-radius:50%;background:#1f3358}
.npCtl #npPP{width:86px;height:86px;font-size:34px;background:var(--acc)}
.npCtl2{display:flex;gap:10px}.npCtl2 button{background:#1f3358}
.tile.wide2{grid-column:1/-1;border-color:var(--gold)}
.grpBar{display:flex;gap:6px;flex-wrap:wrap}.grpBar button{background:var(--btn2);padding:6px 12px}.grpBar button.on{background:var(--acc)}
.grpSet{background:var(--btn2);padding:4px 8px}

.st .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .m{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mdet{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0}
.mdet>summary{cursor:pointer;padding:12px 14px;font-weight:bold;color:var(--gold);list-style:none;display:flex;justify-content:space-between}
.mdet>summary::after{content:"▾"}.mdet[open]>summary::after{content:"▴"}
.mdet .mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:8px;padding:0 10px 12px}
.mdet .mg .tile{padding:10px}
.mdet .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--btn2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--gold);color:#fff}.chip:hover{border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1><span class="radioIcon">📻</span> راديو العالم <small id="byMe" style="font-size:12px;font-weight:normal;color:#fbbf24;cursor:pointer;display:block">إعداد: ASHRAF FATHY</small></h1>
  <button id="fltB" style="background:var(--btn2)">🔍 بحث وفلاتر</button>
  <span id="filters">
  <input id="q" placeholder="اسم المحطة...">
  <select id="country"><option value="">كل الدول</option></select>
  <select id="lang"><option value="">كل اللغات</option><option value="arabic">عربي</option><option value="english">English</option><option value="french">Français</option><option value="spanish">Español</option><option value="german">Deutsch</option><option value="turkish">Türkçe</option><option value="urdu">اردو</option></select>
  <select id="tag"><option value="">كل الأنواع</option><option value="news">أخبار</option><option value="quran">قرآن</option><option value="music">موسيقى</option><option value="pop">Pop</option><option value="classical">كلاسيك</option><option value="jazz">Jazz</option><option value="sports">رياضة</option><option value="talk">حوارات</option></select>
  <button id="go">بحث</button>
  <button id="eg" style="background:#b91c1c">🇪🇬 محطات مصر</button>
  </span>
  <span class="tabs"><button id="tAll" class="on">📻 المحطات</button><button id="tFav">⭐ المفضلة</button><button id="tArc">🎭 <span class="lbl2">أرشيف زمان</span><span class="sh2">الأرشيف</span></button></span>
</header>
<div id="masp" style="padding:10px 16px;background:var(--card2);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  <b style="margin-left:6px">📡 إذاعات ماسبيرو الرسمية:</b>
<button data-m="10" style="background:var(--btn2)">البرنامج العام</button><button data-m="9" style="background:var(--btn2)">صوت العرب</button><button data-m="16" style="background:var(--btn2)">الشرق الأوسط</button><button data-m="7" style="background:var(--btn2)">القرآن الكريم</button><button data-m="8" style="background:var(--btn2)">راديو مصر</button><button data-m="11" style="background:var(--btn2)">الشباب والرياضة</button><button data-m="12" style="background:var(--btn2)">البرنامج الثقافي</button><button data-m="13" style="background:var(--btn2)">الأغاني</button><button data-m="14" style="background:var(--btn2)">القاهرة الكبرى</button><button data-m="18" style="background:var(--btn2)">البرنامج الأوروبي</button><button data-m="15" style="background:var(--btn2)">الإذاعات الموجهة</button>
</div>
<div id="arcBar" style="display:none;padding:10px 16px;background:#3b2a1a;gap:6px;flex-wrap:wrap;align-items:center">
  <input id="aq" placeholder="ابحث: اسم مسرحية، ممثل، مسلسل...">
  <button id="ago">بحث في الأرشيف</button>
  <button id="fmtB" style="background:#6b4423">⚙️ النوع والصيغة</button>
  <span id="fmts"><select id="amt" title="النوع"><option value="audio">🎧 صوت</option><option value="movies">🎬 فيديو</option><option value="both">الكل</option></select>
  <select id="afmt" title="صيغة الصوت"></select>
  <select id="vfmt" title="صيغة الفيديو"></select></span>
  <span id="chips"></span>
</div>
<div id="selBar" style="display:none;padding:8px 16px;background:#14532d;gap:8px;flex-wrap:wrap;align-items:center">
  <label><input type="checkbox" id="selAll"> تحديد الكل</label>
  <span id="selInfo"></span>
  <button id="dirB" style="background:#0e7490">📁 مكان التنزيل: <span id="dirName">لم يُحدد</span></button>
  <button id="dlSel" style="background:#16a34a">⬇ تنزيل المحدد</button>
  <button id="dlStop" style="background:#b91c1c;display:none">⏹ إيقاف التنزيل</button>
  <span id="dlProg" style="font-size:13px"></span>
</div>
<div id="list"></div>
<div id="player">
  <button id="pp">▶</button>
  <span id="seekBox" style="display:none;align-items:center;gap:6px;flex:2;min-width:220px">
    <button id="back30" title="رجوع 30 ثانية" style="background:var(--btn2)">−30 ث</button>
    <span id="tCur" style="font-size:13px">0:00</span>
    <input type="range" id="seek" min="0" max="100" step="1" value="0" style="flex:1;direction:ltr">
    <span id="tDur" style="font-size:13px">0:00</span>
    <button id="fwd30" title="تقديم 30 ثانية" style="background:var(--btn2)">+30 ث</button>
  </span>
  <button id="prevB" title="السابق" style="background:var(--btn2)">⏮</button>
  <button id="nextB" title="التالي" style="background:var(--btn2)">⏭</button>
  <button id="locB" title="روح لمكانه في القائمة" style="background:var(--btn2)">📍<span class="lbl"> مكانه</span></button>
  <button id="upB" class="xtra" title="القائمة الرئيسية اللي فيها المجموعة" style="background:var(--btn2)">📂 قائمته الرئيسية</button>
  <select id="endMode" class="xtra" title="بعد ما الحلقة تخلص"><option value="next">▶ التالي تلقائي</option><option value="stop">⏹ إيقاف بعد النهاية</option><option value="n">🔁 تكرار عدد مرات</option><option value="inf">♾ تكرار بلا حدود</option><option value="all">🔂 تكرار القائمة كلها</option></select>
  <input type="number" id="repN" min="1" value="2" title="عدد مرات التكرار" class="xtra" style="width:60px;display:none">
  <div id="now" title="اضغط للذهاب لمكانه في القائمة" style="cursor:pointer;text-decoration:underline dotted">اختر محطة للاستماع</div>
  <span id="status"></span>
  <button id="moreB" title="خيارات أكتر" style="background:var(--btn2)">⚙️ خيارات</button>
  <button id="rec" class="xtra" title="تسجيل">⏺ تسجيل</button>

<script>
const $=id=>document.getElementById(id), au=$('au');
let API='https://all.api.radio-browser.info', hls=null, current=null, view='all', results=[];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let favs=ls.get('radioFavs',[]);

async function pickServer(){
  for(const s of ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info']){
    try{const r=await fetch(s+'/json/stats',{signal:AbortSignal.timeout(4000)});if(r.ok){API=s;return}}catch{}
  }
}
async function loadCountries(){
  const r=await fetch(API+'/json/countries?order=stationcount&reverse=true&hidebroken=true');
  const c=await r.json();
  $('country').innerHTML+=c.filter(x=>x.stationcount>20).map(x=>`<option value="${x.iso_3166_1}">${x.name} (${x.stationcount})</option>`).join('');
}
async function search(){
  setTab('all');
  $('list').innerHTML='<p>جاري التحميل...</p>';
  const p=new URLSearchParams({limit:($('country').value?1000:300),hidebroken:true,order:'clickcount',reverse:true});
  if($('q').value){p.set('name',$('q').value);p.set('limit',1000)}
  if($('country').value)p.set('countrycode',$('country').value);
  if($('lang').value)p.set('language',$('lang').value);
  if($('tag').value)p.set('tag',$('tag').value);
  try{results=await (await fetch(API+'/json/stations/search?'+p)).json();render(results)}
  catch(e){$('list').innerHTML='<p>تعذر الاتصال بالخادم، تأكد من الإنترنت.</p>'}
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(arr){
  if(!arr.length){$('list').innerHTML='<p>لا توجد محطات.</p>';return}
  $('list').innerHTML=arr.map((s,i)=>`<div class="st ${current&&current.stationuuid===s.stationuuid?'playing':''}" data-i="${i}" data-u="${esc(s.stationuuid)}">
    <img src="${esc(s.favicon)}" onerror="this.style.visibility='hidden'">
    <div class="i"><div class="n">${esc(s.name)}</div><div class="m">${[esc(s.country),esc(s.tags).slice(0,40),s.bitrate?s.bitrate+'kbps':''].filter(Boolean).join(' · ')}</div></div>
    <button class="fav" data-f="${i}">${favs.some(f=>f.stationuuid===s.stationuuid)?'★':'☆'}</button></div>`).join('');
  $('list').onclick=e=>{
    const f=e.target.closest('[data-f]');if(f){toggleFav(arr[f.dataset.f]);e.stopPropagation();return}
    const d=e.target.closest('.st');if(d){playlist=arr;playMedia(arr[d.dataset.i])}
  };
}
function toggleFav(s){
  const k=favs.findIndex(f=>f.stationuuid===s.stationuuid);
  k>=0?favs.splice(k,1):favs.push({stationuuid:s.stationuuid,name:s.name,country:s.country,tags:s.tags,favicon:s.favicon,url_resolved:s.url_resolved,url:s.url,bitrate:s.bitrate,hls:s.hls,video:s.video,id:s.id,file:s.file,masp:s.masp});
  ls.set('radioFavs',favs);if(view!=='arc')render(view==='fav'?favs:results);
}
function play(s){
  current=s;const url=s.url_resolved||s.url;
  if(hls){hls.destroy();hls=null}
  $('now').textContent='▶ '+s.name+' — '+(s.country||'');$('status').textContent='جاري الاتصال...';
  if((s.hls||/\.m3u8/i.test(url))&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(au)}
  else au.src=url;
  au.play().catch(()=>$('status').textContent='المحطة لا تعمل، جرّب غيرها');
  if(!String(s.stationuuid).startsWith('ia:'))fetch(API+'/json/url/'+s.stationuuid).catch(()=>{});
  markPlaying();
}
au.onplaying=()=>{$('status').textContent='يعمل';$('pp').textContent='⏸'};
au.onpause=()=>$('pp').textContent='▶';
au.onerror=()=>$('status').textContent='المحطة لا تعمل، جرّب غيرها';
$('pp').onclick=()=>au.paused?au.play():au.pause();
$('vol').oninput=e=>{au.volume=e.target.value;ls.set('radioVol',e.target.value)};
au.volume=$('vol').value=ls.get('radioVol',0.8);
$('go').onclick=search;$('q').onkeydown=e=>e.key==='Enter'&&search();
['country','lang','tag'].forEach(id=>$(id).onchange=search);

$('tAll').addEventListener('click',()=>setTab('all'));$('tFav').addEventListener('click',()=>setTab('fav'));
$('tFav').onclick=()=>{view='fav';$('tFav').classList.add('on');$('tAll').classList.remove('on');render(favs)};
/* ===== تسجيل ===== */
let recCtl=null;
$('rec').onclick=async()=>{
  if(recCtl){recCtl.abort();return}
  if(!current){alert('شغّل محطة الأول');return}
  const url=current.url_resolved||current.url;
  if(current.hls||/\.m3u8/i.test(url)){$('status').textContent='المحطة دي (HLS) مش بتتسجل، جرّب غيرها';return}
  recCtl=new AbortController();const chunks=[];let type='audio/mpeg',size=0;const t0=Date.now(),name=current.name;
  $('rec').textContent='⏹ إيقاف';$('rec').style.background='#dc2626';
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('status').textContent=`🔴 تسجيل ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · ${(size/1048576).toFixed(1)}MB`},1000);
  try{
    const r=await fetch(url,{signal:recCtl.signal});type=(r.headers.get('content-type')||type).split(';')[0];
    const rd=r.body.getReader();for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);size+=value.length}
  }catch(e){if(e.name!=='AbortError'&&!chunks.length)$('status').textContent='التسجيل غير متاح لهذه المحطة في المتصفح — استخدم نسخة البرنامج (exe)'}
  clearInterval(tick);recCtl=null;$('rec').textContent='⏺ تسجيل';$('rec').style.background='';
  if(chunks.length){
    const ext=/aac|aacp/.test(type)?'aac':/ogg/.test(type)?'ogg':'mp3';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));
    a.download=`ASHRAF FATHY Radio - ${name.replace(/[\\/:*?"<>|]/g,'_')}_${new Date().toISOString().slice(0,16).replace(/[T:]/g,'-')}.${ext}`;a.click();
    $('status').textContent='تم حفظ التسجيل ✔';
  }
};
/* ===== مؤقت النوم ===== */
let sleepAt=0;
const sleepOpt0=$('sleep').options[0];
function sleepTick(){
  if(!sleepAt)return;const left=sleepAt-Date.now();
  if(left<=0){sleepAt=0;au.pause();window.maspStop&&maspStop();try{$('vid').pause()}catch{}if(recCtl)recCtl.abort();$('sleep').value='0';sleepOpt0.textContent='⏲ مؤقت';$('status').textContent='تم الإيقاف بمؤقت النوم 🌙';return}
  const m=Math.floor(left/60000),x=String(Math.floor(left%60000/1000)).padStart(2,'0');
  sleepOpt0.textContent=`⏲ ${m}:${x}`;$('sleep').value='0';
}
$('sleep').onchange=e=>{const m=+e.target.value;
  if(m===-1){sleepAt=0;sleepOpt0.textContent='⏲ مؤقت';$('sleep').value='0';$('status').textContent='اتلغى مؤقت النوم';return}
  if(!m)return;sleepAt=Date.now()+m*60000;$('status').textContent=`هيقفل بعد ${m} دقيقة`;sleepTick()};
setInterval(sleepTick,1000);
au.addEventListener('timeupdate',sleepTick);
document.addEventListener('visibilitychange',sleepTick);
/* ===== منبّه ===== */
let alarm=ls.get('radioAlarm',null);
const showAlarm=()=>$('alarmInfo').textContent=alarm?`مفعّل ${alarm.time} على: ${alarm.st.name}`:'غير مفعّل';
$('alarmBtn').onclick=()=>{const b=$('alarmBox');b.style.display=b.style.display==='none'?'block':'none';showAlarm()};
$('alarmSet').onclick=()=>{if(!current){alert('شغّل المحطة اللي عايزها للمنبّه الأول');return}
  if(!$('alarmTime').value)return;alarm={time:$('alarmTime').value,st:current};ls.set('radioAlarm',alarm);showAlarm();$('alarmBtn').textContent='⏰ '+alarm.time};
$('alarmOff').onclick=()=>{alarm=null;ls.set('radioAlarm',null);showAlarm();$('alarmBtn').textContent='⏰ منبّه'};
if(alarm)$('alarmBtn').textContent='⏰ '+alarm.time;
let lastFire='';
setInterval(()=>{if(!alarm)return;const d=new Date(),hm=d.toTimeString().slice(0,5);
  if(hm===alarm.time&&lastFire!==d.toDateString()+hm){lastFire=d.toDateString()+hm;au.volume=0.1;play(alarm.st);
    let v=0.1;const up=setInterval(()=>{v=Math.min(+$('vol').value,v+0.05);au.volume=v;if(v>=+$('vol').value)clearInterval(up)},2000)}},10000);

$('eg').onclick=()=>{$('q').value='';$('lang').value='';$('tag').value='';$('country').value='EG';search()};
const DM={7:'x84wyku',8:'x8n6dpk',9:'x8n6dqq',10:'x8n6dt3',11:'x8n6dzo',12:'x8n6eci',13:'x8n6dyz',14:'x8n6ebs',15:'x8n6e96',16:'x8n6drt',18:'x8n6e6w'};
function maspPlay(n,name){
  if(n===7){const q={stationuuid:'quran-cairo',name:'إذاعة القرآن الكريم (القاهرة)',country:'Egypt',tags:'قرآن',favicon:'',url_resolved:'https://radio.xecod.com/station/quran-cairo'};playlist=[q];play(q);return}
  au.pause();try{$('vid').pause()}catch{}
  window.open('https://www.maspero.eg/stream/'+n,'_blank');
  $('now').textContent='📡 '+name+' (اتفتحت في صفحة ماسبيرو)';
  current={stationuuid:'masp:'+n,name,country:'ماسبيرو',tags:'',url_resolved:'',masp:n};addRecent&&addRecent(current);
}
window.maspStop=()=>{return;const f=$('maspFrame');if(f){f.src='about:blank';$('maspBox').style.display='none';$('maspBox').classList.remove('big')}};
$('masp').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;maspPlay(+b.dataset.m,b.textContent)};

/* ===== أرشيف زمان (Internet Archive) ===== */
const IA='https://archive.org';
const gb=b=>b>=1073741824?(b/1073741824).toFixed(2)+' جيجا':(b/1048576).toFixed(0)+' ميجا';
const cleanName=t=>String(t||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,150);
// سُلّم الصيغ من الأعلى جودة للأقل
const AUD=[['24bit Flac','FLAC 24bit'],['Flac','FLAC'],['320Kbps MP3','MP3 320'],['256Kbps MP3','MP3 256'],['224Kbps MP3','MP3 224'],['192Kbps MP3','MP3 192'],['VBR MP3','MP3 VBR (العادي)'],['MP3','MP3'],['160Kbps MP3','MP3 160'],['128Kbps MP3','MP3 128'],['Ogg Vorbis','OGG'],['96Kbps MP3','MP3 96'],['64Kbps MP3','MP3 64'],['32Kbps MP3','MP3 32']];
const VID=[['h.264 HD','MP4 HD'],['MPEG4','MP4 (الأصلي)'],['h.264','MP4 h.264'],['MPEG2','MPEG2'],['512Kb MPEG4','MP4 512k (صغير)'],['Ogg Video','OGV'],['h.264 IA','MP4 IA']];
$('afmt').innerHTML=AUD.map((f,i)=>`<option value="${i}" ${f[0]==='VBR MP3'?'selected':''}>🎧 ${f[1]}</option>`).join('');
$('vfmt').innerHTML=VID.map((f,i)=>`<option value="${i}" ${f[0]==='MPEG4'?'selected':''}>🎬 ${f[1]}</option>`).join('');
try{const p=JSON.parse(localStorage.getItem('arcPrefs')||'{}');if(p.a!=null)$('afmt').value=p.a;if(p.v!=null)$('vfmt').value=p.v;if(p.t)$('amt').value=p.t}catch{}
const savePrefs=()=>{try{localStorage.setItem('arcPrefs',JSON.stringify({a:$('afmt').value,v:$('vfmt').value,t:$('amt').value}))}catch{}};
['afmt','vfmt'].forEach(id=>$(id).addEventListener('change',()=>{savePrefs();if(arcState.id)arcOpen(arcState.id,arcState.title)}));
$('amt').addEventListener('change',()=>{savePrefs();arcSearch()});

// يختار لكل حلقة الصيغة المطلوبة، ولو مش موجودة ياخد الأقرب ليها من تحت، ولو مفيش من تحت ياخد الأقرب من فوق
function pickFiles(files){
  const groups={};
  for(const f of files){
    let ladder=AUD,kind='a',k=AUD.findIndex(x=>x[0]===f.format);
    if(k<0){k=VID.findIndex(x=>x[0]===f.format);ladder=VID;kind='v'}
    if(k<0)continue;
    const base=f.name.replace(/\.[^.\/]+$/,'').replace(/(_64kb|_128kb|_vbr|_512kb|\.ia|_hd)$/i,'')+'|'+kind;
    (groups[base]=groups[base]||[]).push({...f,k,kind});
  }
  const out=[];
  for(const [base,arr] of Object.entries(groups)){
    const pref=+(arr[0].kind==='a'?$('afmt').value:$('vfmt').value);
    const below=arr.filter(x=>x.k>=pref).sort((a,b)=>a.k-b.k)[0];
    const above=arr.filter(x=>x.k<pref).sort((a,b)=>b.k-a.k)[0];
    let f=below||above;
    if(f&&f.format==='Ogg Vorbis'&&/iPhone|iPad|Macintosh/.test(navigator.userAgent)){const alt=arr.filter(x=>x.format!=='Ogg Vorbis').sort((a,b)=>b.k-a.k)[0];if(alt)f=alt}
    out.push({...f,exact:f.k===pref,fmtLabel:(f.kind==='a'?AUD:VID)[f.k][1]});
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ar',{numeric:true}));
}
const chips=['مسرحية إذاعية','سهرة إذاعية','مسلسل إذاعي','تمثيلية إذاعية','ساعة لقلبك','ألف ليلة وليلة','البرنامج العام','راديو زمان','مسرحية','فيلم عربي قديم'];
$('chips').innerHTML=chips.map(c=>`<button data-c="${c}" style="background:#6b4423;margin:2px">${c}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){$('aq').value=b.dataset.c;arcSearch()}};
$('ago').onclick=()=>arcSearch();$('aq').onkeydown=e=>e.key==='Enter'&&arcSearch();
function setTab(t){view=t;const T={all:'📻 المحطات',fav:'⭐ المفضلة',arc:'🎭 أرشيف زمان'};if($('viewTitle'))$('viewTitle').textContent=T[t];['tAll','tFav','tArc'].forEach(x=>$(x).classList.toggle('on',x==={all:'tAll',fav:'tFav',arc:'tArc'}[t]));if(t!=='arc')$('selBar').style.display='none'}
$('tArc').onclick=()=>{setTab('arc');arcCats()};

let arcState={mode:'search',docs:[],items:[],id:null,title:''};
function updSel(){
  const boxes=[...$('list').querySelectorAll('.sel')],on=boxes.filter(b=>b.checked);
  let size=0;on.forEach(b=>size+=+b.dataset.size||0);
  $('selInfo').textContent=`محدد ${on.length} من ${boxes.length}`+(on.length?` · حوالي ${gb(size)}`:'');
  $('selAll').checked=boxes.length&&on.length===boxes.length;
}
$('selAll').onchange=e=>{$('list').querySelectorAll('.sel').forEach(b=>b.checked=e.target.checked);updSel()};

async function arcSearch(){
  setTab('arc');
  const q=$('aq').value.trim();if(!q)return;
  arcState={mode:'search',docs:[],items:[],id:null,title:''};
  $('selBar').style.display='flex';$('list').innerHTML='<p>جاري البحث في الأرشيف...</p>';
  const mt=$('amt').value==='both'?'(audio OR movies)':$('amt').value;
  const u=`${IA}/advancedsearch.php?q=${encodeURIComponent('('+q+') AND mediatype:'+mt+' AND format:("VBR MP3" OR MP3 OR "128Kbps MP3" OR "64Kbps MP3" OR "Ogg Vorbis" OR MPEG4 OR "h.264")')}&fl[]=identifier&fl[]=title&fl[]=downloads&fl[]=item_size&fl[]=mediatype&sort[]=downloads+desc&rows=400&output=json`;
  try{const d=await (await fetch(u)).json();let docs=d.response.docs;if(arOnly())docs=docs.filter(x=>/[\u0600-\u06FF]/.test(Array.isArray(x.title)?x.title[0]:x.title||''));docs=docs.slice(0,200);arcState.docs=docs;
    if(!docs.length){$('list').innerHTML='<p>مفيش نتائج، جرّب كلمة تانية.</p>';updSel();return}
    const tot=docs.reduce((a,x)=>a+(+x.item_size||0),0);
    $('list').innerHTML=`<div style="grid-column:1/-1"><button onclick="arcCats()" style="background:#6b4423">↩ الأقسام</button></div><div style="grid-column:1/-1;color:#fbbf24">${docs.length} مجموعة (من أصل ${d.response.numFound}) · الحجم الكلي بكل الصيغ حوالي <b>${gb(tot)}</b> — الحجم الفعلي بالصيغة اللي اخترتها بيتحسب قبل التنزيل</div>`+
      docs.map((x,i)=>`<div class="st" data-id="${esc(x.identifier)}" data-i="${i}">
        <input type="checkbox" class="sel" data-i="${i}" data-size="${+x.item_size||0}" style="width:20px;height:20px;flex:none">
        <div style="font-size:30px">${x.mediatype==='movies'?'🎬':'🎭'}</div>
        <div class="i"><div class="n">${esc(Array.isArray(x.title)?x.title[0]:x.title)}</div><div class="m">${gb(+x.item_size||0)} · ${x.downloads||0} مشاهدة/استماع · اضغط لعرض الحلقات</div></div></div>`).join('');
    $('list').onclick=e=>{if(e.target.classList.contains('sel')){updSel();return}
      const d=e.target.closest('[data-id]');if(d)arcOpen(d.dataset.id,d.querySelector('.n').textContent)};
    updSel();
  }catch(e){$('list').innerHTML='<p>تعذر الاتصال بالأرشيف.</p>'}
}
async function getItems(id,title){
  const m=await (await fetch(`${IA}/metadata/${id}`)).json();
  return pickFiles(m.files||[]).map(f=>({stationuuid:'ia:'+id+'/'+f.name,id,file:f.name,name:(f.title||f.name.replace(/\.[^.]+$/,'')),country:title,tags:'أرشيف',favicon:'',
    size:+f.size||0,video:f.kind==='v',fmtLabel:f.fmtLabel,exact:f.exact,ext:(f.name.match(/\.[^.]+$/)||['.mp3'])[0],
    url_resolved:`${IA}/download/${id}/${f.name.split('/').map(encodeURIComponent).join('/')}`}));
}
async function arcOpen(id,title){
  $('list').innerHTML='<p>جاري تحميل الحلقات...</p>';
  try{const items=await getItems(id,title);arcState={mode:'item',items,id,title,docs:arcState.docs};
    if(!items.length){$('list').innerHTML='<p>المجموعة دي مفيهاش ملفات صوت أو فيديو.</p>';return}
    results=items.filter(x=>!x.video);

let dlAbort=null,dirHandle=null;
$('dlSel').onclick=async()=>{
  const on=[...$('list').querySelectorAll('.sel:checked')].map(b=>+b.dataset.i);
  if(!on.length){alert('حدد حاجة الأول (أو اضغط تحديد الكل)');return}
  let jobs=[];
  if(arcState.mode==='item')jobs=on.map(i=>arcState.items[i]);
  else{
    for(let n=0;n<on.length;n++){const d=arcState.docs[on[n]];$('dlProg').textContent=`جاري حساب الحجم ${n+1}/${on.length}...`;
      try{jobs.push(...await getItems(d.identifier,Array.isArray(d.title)?d.title[0]:d.title))}catch{}}
  }
  $('dlProg').textContent='';
  const tot=jobs.reduce((a,x)=>a+x.size,0);
  if(!jobs.length){alert('مفيش ملفات بالصيغ المتاحة');return}
  if(!confirm(`هيتنزل ${jobs.length} ملف بحجم حوالي ${gb(tot)}.\nاتأكد إن فيه مساحة كفاية. تكمّل؟`))return;
  downloadJobs(jobs);
};
$('dlStop').onclick=()=>dlAbort&&dlAbort.abort();
async function downloadJobs(jobs){
  if(dlAbort){alert('فيه تنزيل شغال، استنى يخلص أو اوقفه');return}
  const useFS='showDirectoryPicker' in window;
  if(useFS){if(!await ensureDir())return}
  dlAbort=new AbortController();$('dlStop').style.display='';
  let done=0,skipped=0,failed=0,bytes=0;const total=jobs.reduce((a,x)=>a+x.size,0);
  for(const it of jobs){
    if(dlAbort.signal.aborted)break;
    const fname=cleanName(it.file.split('/').pop());
    const show=got=>$('dlProg').textContent=`${done+skipped+failed+1}/${jobs.length} · ${it.name.slice(0,40)} · ${gb(bytes+got)} من ${gb(total)}`;
    try{
      if(useFS){
        const folder=await dirHandle.getDirectoryHandle(cleanName(it.country)||'archive',{create:true});
        try{const ex=await (await folder.getFileHandle(fname)).getFile();if(it.size&&ex.size===it.size){skipped++;bytes+=it.size;continue}}catch{}
        const r=await fetch(it.url_resolved,{signal:dlAbort.signal});if(!r.ok)throw 0;
        const fh=await folder.getFileHandle(fname+'.part',{create:true}),w=await fh.createWritable();
        const rd=r.body.getReader();let got=0;
        for(;;){const {done:d,value}=await rd.read();if(d)break;await w.write(value);got+=value.length;if(got%(1<<20)<value.length)show(got)}
        await w.close();
        if(fh.move)await fh.move(fname);else{const f2=await folder.getFileHandle(fname,{create:true}),w2=await f2.createWritable();await w2.write(await fh.getFile());await w2.close();await folder.removeEntry(fname+'.part')}
        bytes+=got;
      }else{
        show(0);const b=await (await fetch(it.url_resolved,{signal:dlAbort.signal})).blob();
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cleanName(it.country+' - '+fname);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);bytes+=b.size;
      }
      done++;
    }catch(e){if(dlAbort.signal.aborted)break;failed++}
  }
  const stopped=dlAbort.signal.aborted;dlAbort=null;$('dlStop').style.display='none';
  $('dlProg').textContent=`${stopped?'⏹ اتوقف':'✔ خلص'} — اتنزل ${done}، موجود قبل كده ${skipped}${failed?`، فشل ${failed}`:''}`;
}

const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('radioApp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{const tx=r.result.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};r.onerror=()=>rej(r.error)});

async function ensureDir(){

const PN={Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let pCfg=Object.assign({on:true,scope:'music',before:10,dur:30,resume:true,city:'',country:'',lat:null,lon:null},ls.get('prayerCfg',{}));

const isQuran=s=>{if(!s)return false;if(s.masp)return s.masp===7;if(s.stationuuid==='quran-cairo')return true;
  return /quran|qur'an|koran|قرآن|القران|القرآن|قران/i.test((s.tags||'')+' '+s.name+' '+(s.country||''))};
async function loadPrayer(force){
  const today=new Date().toDateString();if(!force&&pTimes&&pTimes.day===today)return;
  try{const u=pCfg.lat!=null?`https://api.aladhan.com/v1/timings?latitude=${pCfg.lat}&longitude=${pCfg.lon}&method=4`:`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(pCfg.city)}&country=${encodeURIComponent(pCfg.country)}&method=4`;
    const d=(await (await fetch(u)).json()).data;pTimes={day:today,t:{},where:pCfg.lat!=null?'موقعك الحالي':pCfg.city};Object.keys(PN).forEach(k=>pTimes.t[k]=d.timings[k].slice(0,5));ls.set('prayerTimes',pTimes)}catch{}
  showPrayer();
}
function prayerWindow(){
  if(!pTimes)return null;const now=new Date();
  for(const k of Object.keys(PN)){const [h,m]=pTimes.t[k].split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);
    const a=+t-pCfg.before*60000,b=a+pCfg.dur*60000;if(+now>=a&&+now<b)return{k,end:new Date(b)}}return null}
function blocked(s){return pCfg.on&&pWin&&(pCfg.scope==='all'||!isQuran(s))}
function prayerCheck(){
  if(!pCfg.on){pWin=null;return}
  if(pTimes&&pTimes.day!==new Date().toDateString())loadPrayer();
  const w=prayerWindow(),hm=d=>d.toTimeString().slice(0,5);
  if(w&&!pWin){pWin=w;if(current&&!au.paused&&blocked(current)){au.pause();try{$('vid').pause()}catch{}pPaused=true}}
  else if(!w&&pWin){pWin=null;if(pPaused&&pCfg.resume&&current){au.play().catch(()=>{});$('status').textContent='▶ رجع التشغيل بعد الصلاة'}pPaused=false}
  if(pWin&&pPaused)$('status').textContent=`🕌 صلاة ${PN[pWin.k]} — متوقف لحد ${hm(pWin.end)}`;
}
setInterval(prayerCheck,15000);au.addEventListener('timeupdate',()=>{if(pCfg.on&&Date.now()%5000<300)prayerCheck()});

(function(){const _p=play;play=function(s){prayerCheck();if(blocked(s)){$('status').textContent=`🕌 وقت صلاة ${PN[pWin.k]} — القرآن بس المسموح لحد ${pWin.end.toTimeString().slice(0,5)}`;current=s;pPaused=true;$('now').textContent='⏸ '+s.name;return}_p(s)}})();

function prayerNear(){

  for(const k of Object.keys(PN)){const [h,m]=pTimes.t[k].split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);
    const a=+t-15*60000,b=+t-pCfg.before*60000+pCfg.dur*60000;if(now>=a&&now<Math.max(b,+t+5*60000))return{k,t,inside:now>=+t}}return null}
function prayerTile(){
  const nr=prayerNear();if(!nr)return '';
  if(!pTimes)return `<div class="tile wide2" data-act="prset"><div class="tIc">🕌</div><div><b>مواقيت الصلاة</b><div class="m">اضغط عشان تحدد موقعك</div></div></div>`;
  const now=new Date();let next=null;
  for(const k of Object.keys(PN)){const [h,m]=pTimes.t[k].split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);if(t>now){next={k,t};break}}
  if(!next){const [h,m]=pTimes.t.Fajr.split(':').map(Number);const t=new Date();t.setDate(t.getDate()+1);t.setHours(h,m,0,0);next={k:'Fajr',t}}
  const mins=Math.round((next.t-now)/60000),left=mins>=60?`${Math.floor(mins/60)} س ${mins%60} د`:`${mins} دقيقة`;
  return `<div class="tile wide2" data-act="prset"><div class="tIc">🕌</div><div style="flex:1"><b>صلاة ${PN[next.k]} ${pTimes.t[next.k]}</b> <span class="m">· باقي ${left}</span>

}

    o.querySelectorAll('[data-wl]').forEach(c=>c.onclick=()=>{setLang=c.dataset.wl;ls.set('setLang',setLang);draw()});
