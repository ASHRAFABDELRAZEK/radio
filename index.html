<style>
:root{--bg:#0a1628;--card:#112240;--card2:#0e1d38;--acc:#0F766E;--gold:#C9A227;--txt:#eef2f7;--mut:#94a3b8;--bar:#081120;--btn2:#1f3358;--line:#22365c;--side:#081120}
:root[data-theme=light]{--bg:#F8FAFC;--card:#ffffff;--card2:#eef2f7;--txt:#112240;--mut:#5b6b82;--bar:#112240;--btn2:#475569;--line:#d5dde8;--side:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 16px;background:var(--bar);display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 0 12px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button{cursor:pointer;background:var(--acc);border:none}
.tabs button{background:var(--card)} .tabs button.on{background:var(--acc)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;padding:16px 16px 190px}
.st{background:var(--card);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.st:hover{outline:1px solid var(--acc)} .st.playing{outline:2px solid #22c55e}
.st img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#26324f;flex:none}
.st .n{font-weight:bold;white-space:normal;word-break:break-word;line-height:1.4}
.st .m{font-size:12px;color:var(--mut);white-space:normal}
.st .i{flex:1;min-width:0} .fav{background:none;font-size:20px;padding:0 4px;color:#facc15}
#player{position:fixed;bottom:0;left:0;right:0;background:var(--bar);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
#now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{color:var(--mut);font-size:13px}

#byMe,.byAnim{background:linear-gradient(90deg,#fbbf24,#fff7d6,#f59e0b,#fde68a,#fbbf24);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 4s linear infinite,pulse 2.5s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fbbf24)}50%{filter:drop-shadow(0 0 6px #fbbf24)}}
.radioIcon{display:inline-block;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}

#list{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))!important}

body.hasSide>header,body.hasSide>#list,body.hasSide>#selBar,body.hasSide>#player{margin-right:300px}
body.hasSide>#player{right:300px;margin-right:0}
#topBar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bar);position:sticky;top:0;z-index:5}
#menuB,#sideClose{display:none;background:var(--btn2)}
#viewTitle{font-weight:bold}
#moreB{display:none!important}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14}
@media (max-width:900px){

#list .hgrp,#list .hsub,#list .hgrid .strip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* HX41: أيقونات الأعلى (إجراءات سريعة) بلون بنفسجي مميّز */
.hs-circle #list#list>.strip:not(.gold) .si,.hs-square #list#list>.strip:not(.gold) .si,.hs-dot #list#list>.strip:not(.gold) .si{border:3px solid #c084fc!important;background:linear-gradient(145deg,rgba(192,132,252,.35),rgba(255,255,255,.06))!important}

/* HX45: ⋯ ودبابيس الاكتشافات + إصلاح دايرة تابع الاستماع */
.zmn{margin-inline-start:auto;flex:none;background:rgba(255,255,255,.1);border:none;color:inherit;border-radius:50%;width:32px;height:32px;font-size:17px;line-height:1;padding:0}
#zAuto .strip.one{align-items:center}
.zHomeBox{display:flex!important;flex-direction:column;gap:6px;margin-bottom:14px}.zHomeBox .zsr input{padding:10px 12px;border-radius:12px;font-size:15px}.zHomeBox .strip.one{display:flex;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card,#1c1c22)}
.zpins{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

.hs-circle #list>.hgrp .clrRec,.hs-square #list>.hgrp .clrRec,.hs-dot #list>.hgrp .clrRec{position:absolute!important;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px!important;padding:3px 8px!important;white-space:nowrap}
.hs-circle #list>.hgrp[style],.hs-square #list>.hgrp[style],.hs-dot #list>.hgrp[style]{flex-direction:column!important;justify-content:center!important}

/* ===== SKINS: محرّك المظاهر (7 مظاهر) ===== */
.hmn{top:auto!important;bottom:4px!important;inset-inline-start:auto!important;inset-inline-end:4px!important;background:rgba(0,0,0,.28)!important;width:24px!important;height:24px!important}
/* أيقونات بعمق (3D) */
:root[data-skin] #list .strip .si,:root[data-skin] #list .gcell .gi,:root[data-skin] #list>.hgrp>span:first-child,:root[data-skin] .tile .tIc{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;border-radius:var(--ic-r,14px);background:var(--ic-bg,linear-gradient(145deg,#3b82f6,#1d4ed8));box-shadow:0 8px 16px var(--ic-glow,rgba(0,0,0,.35)),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.22);font-size:22px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
:root[data-skin] #list>.hgrp{position:relative}
:root[data-skin] body,:root[data-skin] input,:root[data-skin] select,:root[data-skin] button{font-family:var(--font,Tahoma,Arial,sans-serif)}
:root[data-skin] #list .strip,:root[data-skin] #list .gcell,:root[data-skin] #list>.hgrp,:root[data-skin] #list>.hsub,:root[data-skin] .st,:root[data-skin] .rc,:root[data-skin] .hxc,:root[data-skin] .tile{border-radius:var(--r,14px);box-shadow:var(--sh,0 2px 8px rgba(0,0,0,.18));background:var(--card);border:1px solid var(--line)}
:root[data-skin] #list .hgrid.hlist .strip{background:var(--card)}
:root[data-skin] header,:root[data-skin] #player{background:var(--bar)}
:root[data-skin] .tabs button.on,:root[data-skin] button:not(.fav):not(.hmn):not(.zmn):not([style*="background"]){background:var(--acc);color:var(--onacc,#fff)}
:root[data-skin] .tabs button{background:var(--card);color:var(--txt)}
:root[data-skin] .st.playing{outline:2px solid var(--acc)}
:root[data-skin] #list .strip.hero{background:var(--hero,linear-gradient(90deg,var(--acc),var(--card)));border:none;color:var(--onacc,#fff)}
:root[data-skin] #list .hgrp:not(.fold){border-color:var(--acc)!important;background:var(--cardon,var(--card))!important}

/* A — زجاج عميق */
:root[data-skin=glass]{--bg:radial-gradient(120% 60% at 50% -10%,#1c3a63 0%,#0b1528 55%,#070d1a 100%);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.05);--cardon:rgba(79,140,255,.22);--acc:#2a5bd7;--gold:#ffd166;--txt:#f1f5f9;--mut:#9fb3cc;--bar:rgba(10,20,40,.85);--btn2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--side:#0b1528;--r:20px;--sh:0 12px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);--ic-bg:linear-gradient(145deg,#60a5fa,#2563eb);--ic-glow:rgba(37,99,235,.5);--font:'Cairo',Tahoma,sans-serif}
:root[data-skin=glass] body{background:#0b1528;background-image:radial-gradient(120% 60% at 50% -10%,#1c3a63 0%,#0b1528 55%,#070d1a 100%);background-attachment:fixed}
:root[data-skin=glass] #list .strip,:root[data-skin=glass] #list .gcell,:root[data-skin=glass] #list>.hgrp,:root[data-skin=glass] .st{backdrop-filter:blur(8px)}
/* B — فخامة ذهبية */
:root[data-skin=gold]{--bg:#0c0d10;--card:linear-gradient(160deg,#1c1a14,#111010);--card2:#141310;--cardon:#1f1b12;--acc:#d4af37;--onacc:#2a1f05;--gold:#f6e7b8;--txt:#f3efe6;--mut:#9a917c;--bar:#0c0d10;--btn2:#232017;--line:#2f2a1a;--side:#0c0d10;--r:18px;--sh:0 14px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,170,.12);--ic-bg:radial-gradient(circle at 35% 30%,#ffe9a3,#d4af37 50%,#7a5d10);--ic-glow:rgba(212,175,55,.3);--font:'Tajawal',Tahoma,sans-serif;--hero:linear-gradient(135deg,#1f1b12,#141210)}
:root[data-skin=gold] #list>.hgrp,:root[data-skin=gold] h1,:root[data-skin=gold] #viewTitle{font-family:'Amiri',serif;color:#f6e7b8}
:root[data-skin=gold] #list .strip.hero{color:#f6e7b8;border:1px solid #4a3f1e}
/* C — فاتح ناعم */
:root[data-skin=soft]{--bg:#eef1f6;--card:#eef1f6;--card2:#e6eaf1;--cardon:#e4f3f1;--acc:#0f766e;--gold:#b45309;--txt:#1e293b;--mut:#64748b;--bar:#eef1f6;--btn2:#dfe4ec;--line:transparent;--side:#eef1f6;--r:22px;--sh:8px 8px 18px #cfd5e0,-8px -8px 18px #ffffff;--ic-bg:linear-gradient(145deg,#2dd4bf,#0d9488);--ic-glow:rgba(13,148,136,.35);--ic-r:50%;--font:'IBM Plex Sans Arabic',Tahoma,sans-serif;--hero:linear-gradient(135deg,#0f766e,#115e59)}
:root[data-skin=soft] input,:root[data-skin=soft] select{background:#eef1f6;color:#1e293b;box-shadow:inset 4px 4px 10px #cfd5e0,inset -4px -4px 10px #fff;border:none}
:root[data-skin=soft] header{box-shadow:0 6px 16px rgba(207,213,224,.6)}
/* E — بطاقات (غامق) */
:root[data-skin=cards]{--bg:#111214;--card:#1f2023;--card2:#191a1d;--cardon:#26282c;--acc:#16a34a;--gold:#fbbf24;--txt:#ffffff;--mut:#9ca3af;--bar:#111214;--btn2:#2a2b2f;--line:rgba(255,255,255,.06);--side:#111214;--r:18px;--sh:0 10px 22px rgba(0,0,0,.35);--ic-bg:linear-gradient(145deg,#22c55e,#15803d);--ic-glow:rgba(21,128,61,.45);--font:'Cairo',Tahoma,sans-serif;--hero:linear-gradient(135deg,#10b981,#047857)}
/* E — بطاقات (فاتح) */
:root[data-skin=cardsLight]{--bg:#f6f7f9;--card:#ffffff;--card2:#eef0f3;--cardon:#e8f7ee;--acc:#15803d;--gold:#b45309;--txt:#111827;--mut:#6b7280;--bar:#f6f7f9;--btn2:#e5e7eb;--line:#e5e7eb;--side:#ffffff;--r:18px;--sh:0 8px 20px rgba(17,24,39,.08);--ic-bg:linear-gradient(145deg,#22c55e,#15803d);--ic-glow:rgba(21,128,61,.3);--font:'Cairo',Tahoma,sans-serif;--hero:linear-gradient(135deg,#10b981,#047857)}

/* F — Material 3 */
:root[data-skin=material]{--bg:#f8f9ff;--card:#e9eef6;--card2:#eef2f8;--cardon:#d7e3f8;--acc:#00639b;--gold:#9a5b00;--txt:#191c20;--mut:#43474e;--bar:#f8f9ff;--btn2:#d7e3f8;--line:transparent;--side:#f8f9ff;--r:20px;--sh:none;--ic-bg:#00639b;--ic-glow:rgba(0,99,155,.25);--font:'Noto Sans Arabic',Tahoma,sans-serif;--hero:#d7e3f8}

:root[data-skin=material] input,:root[data-skin=material] select{background:#e9eef6;color:#191c20;border:none;border-radius:28px}
:root[data-skin=material] #list .strip .si,:root[data-skin=material] #list .gcell .gi,:root[data-skin=material] #list>.hgrp>span:first-child{box-shadow:none;text-shadow:none;background:#d7e3f8}
/* G — أنغامي */
:root[data-skin=anghami]{--bg:#0d0d0f;--card:#1c1c22;--card2:#151519;--cardon:#241f33;--acc:#8b5cf6;--gold:#c4b5fd;--txt:#ffffff;--mut:#9a9aa5;--bar:#0d0d0f;--btn2:#2a2a33;--line:#1f1f25;--side:#0d0d0f;--r:16px;--sh:0 8px 18px rgba(0,0,0,.4);--ic-bg:linear-gradient(145deg,#8b5cf6,#5b21b6);--ic-glow:rgba(139,92,246,.4);--font:'Tajawal',Tahoma,sans-serif;--hero:linear-gradient(120deg,#5b21b6 0%,#8b5cf6 60%,#c4b5fd 100%)}

:root[data-skin] :is(.hs-square,.hs-circle,.hs-dot,.hs-pill) #list#list>.strip .si,:root[data-skin] :is(.hs-square,.hs-circle,.hs-dot) .hgrid.hlist .strip .si{background:var(--ic-bg)!important;border:none!important;box-shadow:0 8px 16px var(--ic-glow),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.22)!important;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* ===== الرئيسية العصرية (G) ===== */
#list .gHome{grid-column:1/-1;display:flex;flex-direction:column;gap:12px;padding:2px 2px 90px;max-width:560px;margin:0 auto;width:100%}
.gHead{display:flex;align-items:center;gap:10px}

.gTitle{flex:1;font-size:21px;font-weight:800;line-height:1}.gTitle small{display:block;font-size:11px;font-weight:normal;color:var(--mut);margin-top:3px}

.gHero i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}.gHero .c1{left:-30px;top:-30px;width:170px;height:170px}.gHero .c2{left:30px;top:20px;width:90px;height:90px;background:rgba(255,255,255,.1)}
.gHero .gk{font-size:11px;font-weight:700;opacity:.9;letter-spacing:.4px}.gHero .gt{font-size:20px;font-weight:800;line-height:1.2}.gHero .gs{font-size:12px;opacity:.9}

.gList{display:flex;flex-direction:column}
.gRowItem,.gCont{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.gCont{padding:10px 12px;border-radius:14px;background:var(--card)}
.gRowItem .gi,.gCont .gi{flex:1;min-width:0}.gRowItem b,.gCont b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gRowItem .m,.gCont .m{font-size:12px;color:var(--mut)}
.gNav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;padding:6px 0 10px;background:var(--bar);border-top:1px solid var(--line)}

:root[data-skin=material] .gHero{box-shadow:none;color:#191c20}:root[data-skin=material] .gplay{background:#00639b;color:#fff}

:root[data-skin=gold] .gTile .gIc,:root[data-skin=gold] .gIc{background:radial-gradient(circle at 35% 30%,#ffe9a3,#d4af37 50%,#7a5d10)!important;color:#2a1f05;box-shadow:0 8px 16px rgba(212,175,55,.3),inset 0 -3px 5px rgba(0,0,0,.35)}
:root[data-skin=gold] .gHero{background:linear-gradient(135deg,#1f1b12,#141210);border:1px solid #4a3f1e;color:#f6e7b8;box-shadow:0 20px 40px rgba(0,0,0,.6)}:root[data-skin=gold] .gplay{background:#d4af37;color:#2a1f05}

:root[data-skin=cards] .gplay,:root[data-skin=cardsLight] .gplay{color:#047857}:root[data-skin=soft] .gplay{color:#0f766e}

:root[data-skin] #now{text-decoration:none!important;font-weight:700;font-size:14px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
:root[data-skin] #status{font-size:12px}
:root[data-skin] #player{box-shadow:0 -8px 24px rgba(0,0,0,.35)}

/* الأقسام الموضوعية: شبكة ثابتة عمودين — نفس المكان دايمًا */

#list .gHome .gHubs .gTile{width:auto;display:flex;align-items:center;gap:10px;text-align:start;background:var(--card);padding:10px;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line)}

.gTools{display:flex;flex-wrap:wrap;gap:8px}.gTools .hxb{margin:0;padding:8px 12px;border-radius:999px;font-size:13px}

/* ===== المشغّل الصغير ===== */
:root[data-skin] #player:not(.inNP){display:none!important}
:root[data-skin] #player.inNP{position:static;width:100%;margin-top:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:12px;box-shadow:none;bottom:auto}
:root[data-skin] #player.inNP #now,:root[data-skin] #player.inNP #status,:root[data-skin] #player.inNP #pp,:root[data-skin] #player.inNP #prevB,:root[data-skin] #player.inNP #nextB{display:none}
:root[data-skin] #player.inNP #seekBox{flex:1 1 100%}
#mini{position:fixed;left:10px;right:10px;bottom:64px;z-index:7;display:none;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.4);cursor:pointer;overflow:hidden}
:root[data-skin] body.miniOn:not(.npOn) #mini{display:flex}
:root[data-skin] body.miniOn #list{padding-bottom:160px}
#mini .mBar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(128,128,128,.2)}#mini .mProg{display:block;height:100%;background:var(--acc);width:0;transition:width .5s linear}
#mini .mArt{width:44px;height:44px;border-radius:10px;background:var(--ic-bg);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
#mini .mArt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#mini .mTxt{flex:1;min-width:0;display:flex;flex-direction:column}#mini .mName{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini .mSub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mBtn{width:40px;height:40px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;flex:none;background:var(--btn2)!important;color:var(--txt)!important}
#mini .mPP{background:var(--acc)!important;color:var(--onacc,#fff)!important}#mini .mX{width:30px;height:30px;font-size:13px;opacity:.7}
:root[data-skin=anghami] #mini{border-top:2px solid var(--acc)}

#mini{flex-wrap:wrap}
#mini .mSeek{display:none;flex:1 1 100%;align-items:center;gap:8px;font-size:11px;color:var(--mut);direction:ltr;margin-top:2px}
#mini.hasSeek .mSeek{display:flex}
#mini .mRange{flex:1;accent-color:var(--acc);height:22px;margin:0}
#npBox #seekBox.npSeek{display:flex!important;width:min(520px,92vw);margin:10px auto 0;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
#npBox #seekBox.npSeek #seek{flex:1 1 100%;accent-color:var(--acc);height:28px}

/* شاشة يعمل الآن حسب المظهر */
:root[data-skin] #npBox{background:var(--bg);color:var(--txt);align-items:flex-start;overflow-y:auto;padding:70px 0 40px}
:root[data-skin] .npIn{margin:0 auto;gap:10px}
:root[data-skin] #npArt{background:var(--ic-bg);color:#fff;border:1px solid var(--line);box-shadow:0 24px 48px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);font-size:80px}
:root[data-skin] #npName{font-size:20px;font-weight:800;line-height:1.3}
:root[data-skin] #npSub{display:none}
:root[data-skin] .npCtl button{background:var(--card)!important;color:var(--txt)!important;border:1px solid var(--line);width:64px;height:64px;font-size:24px}
:root[data-skin] .npCtl #npPP{background:var(--acc)!important;color:var(--onacc,#fff)!important;width:84px;height:84px;font-size:32px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
:root[data-skin] .npCtl2 button,:root[data-skin] #npBox .hxb,:root[data-skin] #npBox .chip{background:var(--card)!important;color:var(--txt)!important;border:1px solid var(--line)}
:root[data-skin] .npX{background:var(--card)!important;color:var(--txt)!important;border:1px solid var(--line);right:auto;left:14px}
:root[data-skin] #npBox #seekBox.npSeek{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
:root[data-skin] #npBox .npIn > *{max-width:100%}
:root[data-skin] .npIn>*{order:3}:root[data-skin] .npIn>.npX,:root[data-skin] .npIn>#npArt,:root[data-skin] .npIn>#npName,:root[data-skin] .npIn>#npSub,:root[data-skin] .npIn>#npStatus{order:0}:root[data-skin] .npIn>.npCtl{order:1}:root[data-skin] .npIn>#seekBox.npSeek{order:2}

.palGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.palCard{border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--card);cursor:pointer}.palCard.on{border-color:var(--txt)}
.palSw{height:54px;position:relative}.palSw i{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.palN{padding:6px 8px;font-size:12px;font-weight:700;text-align:center}
:root[data-skin] #npBox .chip.on,:root[data-skin] .chip.on,:root[data-skin] .hxb.on,:root[data-skin] [data-hx].on{background:var(--acc)!important;color:var(--onacc,#fff)!important;border-color:var(--acc)!important;box-shadow:0 0 0 2px var(--acc) inset,0 6px 14px rgba(0,0,0,.25);font-weight:800}
:root[data-skin] .chip.on::before{content:"✓ ";font-weight:900}
:root[data-skin] #npBox .chip:not(.on){opacity:.85}
</style>
</head>
<body>
<header>
  <h1><span class="radioIcon">📻</span> راديو العالم <small id="byMe" style="font-size:12px;font-weight:normal;color:#fbbf24;cursor:pointer;display:block">إعداد: ASHRAF FATHY</small></h1>
  <button id="fltB" style="background:var(--btn2)">🔍 بحث وفلاتر</button>
  <span id="filters">
  <input id="q" placeholder="اسم المحطة...">
  <select id="country"><option value="">كل الدول</option></select>
  <select id="lang"><option value="">كل اللغات</option><option value="arabic">عربي</option><option value="english">English</option><option value="french">Français</option><option value="spanish">Español</option><option value="german">Deutsch</option><option value="turkish">Türkçe</option><option value="urdu">اردو</option></select>
  <select id="tag"><option value="">كل الأنواع</option><option value="news">أخبار</option><option value="quran">قرآن</option><option value="music">موسيقى</option><option value="pop">Pop</option><option value="classical">كلاسيك</option><option value="jazz">Jazz</option><option value="sports">رياضة</option><option value="talk">حوارات</option></select>
  <button id="go">بحث</button>
  <button id="eg" style="background:#b91c1c">🇪🇬 محطات مصر</button>
  </span>
  <span class="tabs"><button id="tAll" class="on">📻 المحطات</button><button id="tFav">⭐ المفضلة</button><button id="tArc">🎭 <span class="lbl2">أرشيف زمان</span><span class="sh2">الأرشيف</span></button></span>
</header>
<div id="masp" style="padding:10px 16px;background:var(--card2);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  <b style="margin-left:6px">📡 إذاعات ماسبيرو الرسمية:</b>
<button data-m="10" style="background:var(--btn2)">البرنامج العام</button><button data-m="9" style="background:var(--btn2)">صوت العرب</button><button data-m="16" style="background:var(--btn2)">الشرق الأوسط</button><button data-m="7" style="background:var(--btn2)">القرآن الكريم</button><button data-m="8" style="background:var(--btn2)">راديو مصر</button><button data-m="11" style="background:var(--btn2)">الشباب والرياضة</button><button data-m="12" style="background:var(--btn2)">البرنامج الثقافي</button><button data-m="13" style="background:var(--btn2)">الأغاني</button><button data-m="14" style="background:var(--btn2)">القاهرة الكبرى</button><button data-m="18" style="background:var(--btn2)">البرنامج الأوروبي</button><button data-m="15" style="background:var(--btn2)">الإذاعات الموجهة</button>
</div>
<div id="arcBar" style="display:none;padding:10px 16px;background:#3b2a1a;gap:6px;flex-wrap:wrap;align-items:center">
  <input id="aq" placeholder="ابحث: اسم مسرحية، ممثل، مسلسل...">
  <button id="ago">بحث في الأرشيف</button>
  <button id="fmtB" style="background:#6b4423">⚙️ النوع والصيغة</button>
  <span id="fmts"><select id="amt" title="النوع"><option value="audio">🎧 صوت</option><option value="movies">🎬 فيديو</option><option value="both">الكل</option></select>
  <select id="afmt" title="صيغة الصوت"></select>
  <select id="vfmt" title="صيغة الفيديو"></select></span>
  <span id="chips"></span>
</div>
<div id="selBar" style="display:none;padding:8px 16px;background:#14532d;gap:8px;flex-wrap:wrap;align-items:center">
  <label><input type="checkbox" id="selAll"> تحديد الكل</label>
  <span id="selInfo"></span>
  <button id="dirB" style="background:#0e7490">📁 مكان التنزيل: <span id="dirName">لم يُحدد</span></button>
  <button id="dlSel" style="background:#16a34a">⬇ تنزيل المحدد</button>
  <button id="dlStop" style="background:#b91c1c;display:none">⏹ إيقاف التنزيل</button>
  <span id="dlProg" style="font-size:13px"></span>
</div>
<div id="list"></div>
<div id="player">
  <button id="pp">▶</button>
  <span id="seekBox" style="display:none;align-items:center;gap:6px;flex:2;min-width:220px">
    <button id="back30" title="رجوع 30 ثانية" style="background:var(--btn2)">−30 ث</button>
    <span id="tCur" style="font-size:13px">0:00</span>
    <input type="range" id="seek" min="0" max="100" step="1" value="0" style="flex:1;direction:ltr">
    <span id="tDur" style="font-size:13px">0:00</span>
    <button id="fwd30" title="تقديم 30 ثانية" style="background:var(--btn2)">+30 ث</button>
  </span>
  <button id="prevB" title="السابق" style="background:var(--btn2)">⏮</button>
  <button id="nextB" title="التالي" style="background:var(--btn2)">⏭</button>
  <button id="locB" title="روح لمكانه في القائمة" style="background:var(--btn2)">📍<span class="lbl"> مكانه</span></button>
  <button id="upB" class="xtra" title="القائمة الرئيسية اللي فيها المجموعة" style="background:var(--btn2)">📂 قائمته الرئيسية</button>
  <select id="endMode" class="xtra" title="بعد ما الحلقة تخلص"><option value="next">▶ التالي تلقائي</option><option value="stop">⏹ إيقاف بعد النهاية</option><option value="n">🔁 تكرار عدد مرات</option><option value="inf">♾ تكرار بلا حدود</option><option value="all">🔂 تكرار القائمة كلها</option></select>
  <input type="number" id="repN" min="1" value="2" title="عدد مرات التكرار" class="xtra" style="width:60px;display:none">
  <div id="now" title="اضغط للذهاب لمكانه في القائمة" style="cursor:pointer;text-decoration:underline dotted">اختر محطة للاستماع</div>
  <span id="status"></span>
  <button id="moreB" title="خيارات أكتر" style="background:var(--btn2)">⚙️ خيارات</button>
  <button id="rec" class="xtra" title="تسجيل">⏺ تسجيل</button>
  <select id="sleep" title="مؤقت النوم"><option value="0">⏲ مؤقت</option><option value="5">5 دقايق</option><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option><option value="60">ساعة</option><option value="90">ساعة ونص</option><option value="120">ساعتين</option><option value="-1">✕ إلغاء المؤقت</option></select>
  <button id="alarmBtn" class="xtra" title="منبّه">⏰ منبّه</button>
  <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" style="width:110px">
</div>
<audio id="au"></audio>
<div id="aboutBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;align-items:center;justify-content:center">
  <div style="background:var(--card);padding:24px 28px;border-radius:14px;text-align:center;max-width:90vw;border:1px solid #fbbf24">
    <div style="font-size:40px" class="radioIcon">📻</div>
    <h2 style="margin:6px 0">راديو العالم</h2>
    <div style="color:#fbbf24;font-size:18px;font-weight:bold;margin:8px 0" class="byAnim">إعداد وتصميم: ASHRAF FATHY</div>
    <div style="color:var(--mut);font-size:13px;line-height:1.8">إذاعات العالم · إذاعات ماسبيرو · أرشيف زمان<br>جميع الحقوق محفوظة © 2026</div>
    <button id="aboutClose" style="margin-top:14px">إغلاق</button>
  </div>
</div>
<div id="vidBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:8px">
  <div style="width:min(960px,94vw);display:flex;justify-content:space-between;align-items:center"><b id="vidTitle"></b><button id="vidClose" style="background:#b91c1c">✕ إغلاق</button></div>
  <video id="vid" controls style="width:min(960px,94vw);max-height:80vh;background:#000"></video>
</div>
<div id="alarmBox" style="display:none;position:fixed;bottom:70px;left:16px;background:var(--card);padding:14px;border-radius:10px;border:1px solid var(--line);z-index:9">
  <div style="margin-bottom:8px">شغّل المحطة الحالية الساعة:</div>
  <input type="time" id="alarmTime"> <button id="alarmSet">تفعيل</button> <button id="alarmOff" style="background:#64748b">إلغاء</button>
  <div id="alarmInfo" style="font-size:13px;color:var(--mut);margin-top:8px"></div>
  <div style="font-size:12px;color:var(--mut)">البرنامج لازم يفضل مفتوح والجهاز صاحي.</div>
</div>
<script>
const $=id=>document.getElementById(id), au=$('au');
let API='https://all.api.radio-browser.info', hls=null, current=null, view='all', results=[];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let favs=ls.get('radioFavs',[]);

async function pickServer(){
  for(const s of ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info']){
    try{const r=await fetch(s+'/json/stats',{signal:AbortSignal.timeout(4000)});if(r.ok){API=s;return}}catch{}
  }
}
async function loadCountries(){
  const r=await fetch(API+'/json/countries?order=stationcount&reverse=true&hidebroken=true');
  const c=await r.json();
  $('country').innerHTML+=c.filter(x=>x.stationcount>20&&x.iso_3166_1!=='IL').map(x=>`<option value="${x.iso_3166_1}">${x.name} (${x.stationcount})</option>`).join('');
}
async function search(){
  setTab('all');
  $('list').innerHTML='<p>جاري التحميل...</p>';
  const p=new URLSearchParams({limit:($('country').value?1000:300),hidebroken:true,order:'clickcount',reverse:true});
  if($('q').value){p.set('name',$('q').value);p.set('limit',1000)}
  if($('country').value)p.set('countrycode',$('country').value);
  if($('lang').value)p.set('language',$('lang').value);
  if($('tag').value)p.set('tag',$('tag').value);
  try{results=await (await fetch(API+'/json/stations/search?'+p)).json();render(results)}
  catch(e){$('list').innerHTML='<p>تعذر الاتصال بالخادم، تأكد من الإنترنت.</p>'}
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXCL=s=>s&&(s.countrycode==='IL'||/hebrew|israel/i.test((s.language||'')+' '+(s.country||'')));
function render(arr){
  arr=arr.filter(s=>!EXCL(s));
  if(!arr.length){$('list').innerHTML='<p>لا توجد محطات.</p>';return}
  $('list').innerHTML=arr.map((s,i)=>`<div class="st ${current&&current.stationuuid===s.stationuuid?'playing':''}" data-i="${i}" data-u="${esc(s.stationuuid)}">
    <img src="${esc(s.favicon)}" onerror="this.style.visibility='hidden'">
    <div class="i"><div class="n">${esc(s.name)}</div><div class="m">${[esc(s.country),esc(s.tags).slice(0,40),s.bitrate?s.bitrate+'kbps':''].filter(Boolean).join(' · ')}</div></div>
    <button class="fav" data-f="${i}">${favs.some(f=>f.stationuuid===s.stationuuid)?'★':'☆'}</button></div>`).join('');
  $('list').onclick=e=>{
    const f=e.target.closest('[data-f]');if(f){toggleFav(arr[f.dataset.f]);e.stopPropagation();return}
    const d=e.target.closest('.st');if(d){playlist=arr;playMedia(arr[d.dataset.i])}
  };
}
function toggleFav(s){
  const k=favs.findIndex(f=>f.stationuuid===s.stationuuid);
  k>=0?favs.splice(k,1):favs.push({stationuuid:s.stationuuid,name:s.name,country:s.country,tags:s.tags,favicon:s.favicon,url_resolved:s.url_resolved,url:s.url,bitrate:s.bitrate,hls:s.hls,video:s.video,id:s.id,file:s.file,masp:s.masp});
  ls.set('radioFavs',favs);if(view!=='arc')render(view==='fav'?favs:results);
}
function play(s){
  current=s;const url=s.url_resolved||s.url;
  if(hls){hls.destroy();hls=null}
  $('now').textContent='▶ '+s.name+' — '+(s.country||'');$('status').textContent='جاري الاتصال...';
  if((s.hls||/\.m3u8/i.test(url))&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(au)}
  else au.src=url;
  au.play().catch(()=>$('status').textContent='المحطة لا تعمل، جرّب غيرها');
  if(!String(s.stationuuid).startsWith('ia:'))fetch(API+'/json/url/'+s.stationuuid).catch(()=>{});
  markPlaying();
}
au.onplaying=()=>{$('status').textContent='يعمل';$('pp').textContent='⏸'};
au.onpause=()=>$('pp').textContent='▶';
au.onerror=()=>$('status').textContent='المحطة لا تعمل، جرّب غيرها';
$('pp').onclick=()=>au.paused?au.play():au.pause();
$('vol').oninput=e=>{au.volume=e.target.value;ls.set('radioVol',e.target.value)};
au.volume=$('vol').value=ls.get('radioVol',0.8);
$('go').onclick=search;$('q').onkeydown=e=>e.key==='Enter'&&search();
['country','lang','tag'].forEach(id=>$(id).onchange=search);
$('tAll').onclick=()=>{view='all';$('tAll').classList.add('on');$('tFav').classList.remove('on');render(results)};
$('tAll').addEventListener('click',()=>setTab('all'));$('tFav').addEventListener('click',()=>setTab('fav'));
$('tFav').onclick=()=>{view='fav';$('tFav').classList.add('on');$('tAll').classList.remove('on');render(favs)};
/* ===== تسجيل ===== */
let recCtl=null;
$('rec').onclick=async()=>{
  if(recCtl){recCtl.abort();return}
  if(!current){alert('شغّل محطة الأول');return}
  const url=current.url_resolved||current.url;
  if(current.hls||/\.m3u8/i.test(url)){$('status').textContent='المحطة دي (HLS) مش بتتسجل، جرّب غيرها';return}
  recCtl=new AbortController();const chunks=[];let type='audio/mpeg',size=0;const t0=Date.now(),name=current.name;
  $('rec').textContent='⏹ إيقاف';$('rec').style.background='#dc2626';
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('status').textContent=`🔴 تسجيل ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · ${(size/1048576).toFixed(1)}MB`},1000);
  try{
    const r=await fetch(url,{signal:recCtl.signal});type=(r.headers.get('content-type')||type).split(';')[0];
    const rd=r.body.getReader();for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);size+=value.length}
  }catch(e){if(e.name!=='AbortError'&&!chunks.length)$('status').textContent='التسجيل غير متاح لهذه المحطة في المتصفح — استخدم نسخة البرنامج (exe)'}
  clearInterval(tick);recCtl=null;$('rec').textContent='⏺ تسجيل';$('rec').style.background='';
  if(chunks.length){
    const ext=/aac|aacp/.test(type)?'aac':/ogg/.test(type)?'ogg':'mp3';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));
    a.download=`ASHRAF FATHY Radio - ${name.replace(/[\\/:*?"<>|]/g,'_')}_${new Date().toISOString().slice(0,16).replace(/[T:]/g,'-')}.${ext}`;a.click();
    $('status').textContent='تم حفظ التسجيل ✔';
  }
};
/* ===== مؤقت النوم ===== */
let sleepAt=0;
const sleepOpt0=$('sleep').options[0];
function sleepTick(){
  if(!sleepAt)return;const left=sleepAt-Date.now();
  if(left<=0){sleepAt=0;au.pause();window.maspStop&&maspStop();try{$('vid').pause()}catch{}if(recCtl)recCtl.abort();$('sleep').value='0';sleepOpt0.textContent='⏲ مؤقت';$('status').textContent='تم الإيقاف بمؤقت النوم 🌙';return}
  const m=Math.floor(left/60000),x=String(Math.floor(left%60000/1000)).padStart(2,'0');

// يختار لكل حلقة الصيغة المطلوبة، ولو مش موجودة ياخد الأقرب ليها من تحت، ولو مفيش من تحت ياخد الأقرب من فوق
function pickFiles(files){
  const groups={};
  for(const f of files){
    let ladder=AUD,kind='a',k=AUD.findIndex(x=>x[0]===f.format);
    if(k<0){k=VID.findIndex(x=>x[0]===f.format);ladder=VID;kind='v'}
    if(k<0)continue;
    const base=f.name.replace(/\.[^.\/]+$/,'').replace(/(_64kb|_128kb|_vbr|_512kb|\.ia|_hd)$/i,'')+'|'+kind;
    (groups[base]=groups[base]||[]).push({...f,k,kind});
  }
  const out=[];
  for(const [base,arr] of Object.entries(groups)){
    const pref=+(arr[0].kind==='a'?$('afmt').value:$('vfmt').value);
    const below=arr.filter(x=>x.k>=pref).sort((a,b)=>a.k-b.k)[0];
    const above=arr.filter(x=>x.k<pref).sort((a,b)=>b.k-a.k)[0];
    let f=below||above;
    if(f&&f.format==='Ogg Vorbis'&&/iPhone|iPad|Macintosh/.test(navigator.userAgent)){const alt=arr.filter(x=>x.format!=='Ogg Vorbis').sort((a,b)=>b.k-a.k)[0];if(alt)f=alt}
    out.push({...f,exact:f.k===pref,fmtLabel:(f.kind==='a'?AUD:VID)[f.k][1]});
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ar',{numeric:true}));
}

async function downloadJobs(jobs){
  if(dlAbort){alert('فيه تنزيل شغال، استنى يخلص أو اوقفه');return}
  const useFS='showDirectoryPicker' in window;
  if(useFS){if(!await ensureDir())return}
  dlAbort=new AbortController();$('dlStop').style.display='';
  let done=0,skipped=0,failed=0,bytes=0;const total=jobs.reduce((a,x)=>a+x.size,0);
  for(const it of jobs){
    if(dlAbort.signal.aborted)break;
    const fname=cleanName(it.file.split('/').pop());
    const show=got=>$('dlProg').textContent=`${done+skipped+failed+1}/${jobs.length} · ${it.name.slice(0,40)} · ${gb(bytes+got)} من ${gb(total)}`;
    try{
      if(useFS){
        const folder=await dirHandle.getDirectoryHandle(cleanName(it.country)||'archive',{create:true});
        try{const ex=await (await folder.getFileHandle(fname)).getFile();if(it.size&&ex.size===it.size){skipped++;bytes+=it.size;continue}}catch{}
        const r=await fetch(it.url_resolved,{signal:dlAbort.signal});if(!r.ok)throw 0;
        const fh=await folder.getFileHandle(fname+'.part',{create:true}),w=await fh.createWritable();
        const rd=r.body.getReader();let got=0;
        for(;;){const {done:d,value}=await rd.read();if(d)break;await w.write(value);got+=value.length;if(got%(1<<20)<value.length)show(got)}
        await w.close();
        if(fh.move)await fh.move(fname);else{const f2=await folder.getFileHandle(fname,{create:true}),w2=await f2.createWritable();await w2.write(await fh.getFile());await w2.close();await folder.removeEntry(fname+'.part')}
        bytes+=got;
      }else{
        show(0);const b=await (await fetch(it.url_resolved,{signal:dlAbort.signal})).blob();
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cleanName(it.country+' - '+fname);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);bytes+=b.size;
      }
      done++;
    }catch(e){if(dlAbort.signal.aborted)break;failed++}
  }
  const stopped=dlAbort.signal.aborted;dlAbort=null;$('dlStop').style.display='none';
  $('dlProg').textContent=`${stopped?'⏹ اتوقف':'✔ خلص'} — اتنزل ${done}، موجود قبل كده ${skipped}${failed?`، فشل ${failed}`:''}`;
}

(function(){

  window.navPush=()=>{try{history.pushState({r:1},'')}catch{}updBack()};
  function goBack(){

// ===== 16) المشغّل الصغير: يظهر فقط عند وجود تشغيل، والضغط عليه يفتح شاشة «يعمل الآن» الكاملة =====
(function(){
const mini=document.createElement('div');mini.id='mini';
mini.innerHTML=`<div class="mBar"><i class="mProg"></i></div><div class="mArt"></div><div class="mTxt"><b class="mName"></b><span class="mSub m"></span></div><button class="mBtn mPP" aria-label="تشغيل/إيقاف">${gsvg('play',22)}</button><button class="mBtn mNext" aria-label="التالي"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button><button class="mBtn mX" aria-label="إغلاق المشغّل">✕</button><div class="mSeek"><span class="mT1">0:00</span><input type="range" class="mRange" min="0" max="1000" value="0" aria-label="تقديم وتأخير"><span class="mT2">0:00</span></div>`;
document.body.appendChild(mini);
const PAUSE='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
function art(){const a=mini.querySelector('.mArt');if(!current)return;const isIA=String(current.stationuuid).startsWith('ia:');
  a.innerHTML=current.favicon?`<img src="${esc(current.favicon)}" onerror="this.remove()">`:'';a.insertAdjacentHTML('beforeend',gsvg(isIA?'mask':current.masp?'tower':'radio',22));}
function upd(){
  if(!current){document.body.classList.remove('miniOn');return}
  document.body.classList.add('miniOn');
  mini.querySelector('.mName').textContent=current.name;
  const st=$('status').textContent;mini.querySelector('.mSub').textContent=(current.country?current.country+' · ':'')+(st||'');
  mini.querySelector('.mPP').innerHTML=au.paused?gsvg('play',22):PAUSE;
  const p=mini.querySelector('.mProg');const fin=isFinite(au.duration)&&au.duration>0;p.style.width=fin?(au.currentTime/au.duration*100)+'%':'0';
  mini.classList.toggle('hasSeek',fin);
  if(fin&&!seeking){mini.querySelector('.mRange').value=Math.round(au.currentTime/au.duration*1000);mini.querySelector('.mT1').textContent=fmt(au.currentTime);mini.querySelector('.mT2').textContent=fmt(au.duration)}
}
let seeking=false;const rng=mini.querySelector('.mRange');
rng.addEventListener('click',e=>e.stopPropagation());rng.addEventListener('pointerdown',e=>{seeking=true;e.stopPropagation()});
rng.addEventListener('input',e=>{e.stopPropagation();if(isFinite(au.duration))mini.querySelector('.mT1').textContent=fmt(au.duration*rng.value/1000)});
rng.addEventListener('change',e=>{e.stopPropagation();if(isFinite(au.duration))au.currentTime=au.duration*rng.value/1000;seeking=false});
mini.querySelector('.mSeek').addEventListener('click',e=>e.stopPropagation());
let lastName='';
setInterval(()=>{if(current&&current.name!==lastName){lastName=current.name;art()}upd()},700);
['playing','pause','ended','timeupdate','error'].forEach(ev=>au.addEventListener(ev,upd));
mini.querySelector('.mPP').onclick=e=>{e.stopPropagation();$('pp').click();setTimeout(upd,200)};
mini.querySelector('.mNext').onclick=e=>{e.stopPropagation();$('nextB').click()};
mini.querySelector('.mX').onclick=e=>{e.stopPropagation();au.pause();try{au.src=''}catch{}current=null;$('now').textContent='اختر محطة للاستماع';$('status').textContent='';document.body.classList.remove('miniOn');if(typeof markPlaying==='function')markPlaying()};
mini.onclick=()=>{if(current)npOpen()};
// أدوات التشغيل الكاملة داخل شاشة «يعمل الآن»
try{const np=document.getElementById('npBox');const inn=np.querySelector('.npIn');const pl=$('player');inn.appendChild(pl);pl.classList.add('inNP');const sb=$('seekBox');const ctl=$('npPP')&&$('npPP').closest('.npCtl');if(sb&&ctl)ctl.insertAdjacentElement('afterend',sb);sb.classList.add('npSeek');
  const _open=window.npOpen;window.npOpen=()=>{_open();document.body.classList.add('npOn')};
  const obs=new MutationObserver(()=>document.body.classList.toggle('npOn',np.style.display==='flex'));obs.observe(np,{attributes:true,attributeFilter:['style']});
}catch{}
// اقتراح عند انتهاء القائمة
au.addEventListener('ended',()=>{setTimeout(()=>{if($('status').textContent==='خلصت القائمة'&&current){$('status').textContent='خلصت — اضغط التالي أو اختر من نفس القسم';upd()}},800)});
upd();
})();


// ===== 17) مجموعات الألوان (مستقلة عن شكل التصميم) =====
(function(){
const PALS=[
 ['auto','ألوان التصميم نفسه','', null],
 ['violet','بنفسجي عصري','#8b5cf6',{acc:'#8b5cf6',on:'#fff',hero:'linear-gradient(120deg,#5b21b6 0%,#8b5cf6 60%,#c4b5fd 100%)',ic:'linear-gradient(145deg,#a78bfa,#5b21b6)'}],
 ['emerald','أخضر زمردي','#10b981',{acc:'#10b981',on:'#06281c',hero:'linear-gradient(120deg,#065f46,#10b981 60%,#6ee7b7)',ic:'linear-gradient(145deg,#34d399,#047857)'}],
 ['burgundy','عنابي','#9f1239',{acc:'#be123c',on:'#fff',hero:'linear-gradient(120deg,#4c0519,#9f1239 60%,#fb7185)',ic:'linear-gradient(145deg,#f43f5e,#881337)'}],
 ['lime','ليموني','#a3e635',{acc:'#a3e635',on:'#1a2e05',hero:'linear-gradient(120deg,#3f6212,#84cc16 60%,#d9f99d)',ic:'linear-gradient(145deg,#bef264,#4d7c0f)'}],
 ['gold','أسود وذهبي','#d4af37',{acc:'#d4af37',on:'#2a1f05',hero:'linear-gradient(120deg,#1f1b12,#6b5212 60%,#d4af37)',ic:'radial-gradient(circle at 35% 30%,#ffe9a3,#d4af37 50%,#7a5d10)'}],
 ['navy','كحلي ملكي','#1e3a8a',{acc:'#3b82f6',on:'#fff',hero:'linear-gradient(120deg,#0f1f4a,#1e3a8a 60%,#60a5fa)',ic:'linear-gradient(145deg,#60a5fa,#1e3a8a)'}],
 ['teal','تركواز','#0d9488',{acc:'#14b8a6',on:'#042f2e',hero:'linear-gradient(120deg,#134e4a,#0d9488 60%,#5eead4)',ic:'linear-gradient(145deg,#2dd4bf,#0f766e)'}],
 ['copper','نحاسي','#c2410c',{acc:'#ea580c',on:'#fff',hero:'linear-gradient(120deg,#431407,#c2410c 60%,#fdba74)',ic:'linear-gradient(145deg,#fb923c,#9a3412)'}],
 ['rose','وردي راقي','#db2777',{acc:'#ec4899',on:'#fff',hero:'linear-gradient(120deg,#831843,#db2777 60%,#f9a8d4)',ic:'linear-gradient(145deg,#f472b6,#9d174d)'}],
 ['slate','رمادي فحمي','#64748b',{acc:'#94a3b8',on:'#0f172a',hero:'linear-gradient(120deg,#1e293b,#475569 60%,#cbd5e1)',ic:'linear-gradient(145deg,#94a3b8,#334155)'}]
];
window.PALS=PALS;
window.applyPalette=function(k){
  const r=document.documentElement.style;['--acc','--onacc','--hero','--ic-bg','--ic-glow','--gold'].forEach(v=>r.removeProperty(v));
  const P=PALS.find(p=>p[0]===k);if(!P||!P[3])return;
  const c=P[3];r.setProperty('--acc',c.acc);r.setProperty('--onacc',c.on);r.setProperty('--hero',c.hero);r.setProperty('--ic-bg',c.ic);r.setProperty('--ic-glow',c.acc+'66');r.setProperty('--gold',c.acc);
};
applyPalette(ls.get('palette','auto'));
const _as=window.applySkin;window.applySkin=function(s){_as(s);applyPalette(ls.get('palette','auto'))};
if(window.HX){
  const _t=HX.theme;HX.theme=function(){_t();const cur=ls.get('palette','auto');
    const box=document.querySelector('.hxp .hxc');if(!box)return;
    box.insertAdjacentHTML('beforeend',`<div style="font-weight:800;margin-top:10px">🎨 مجموعة الألوان</div><div class="m">الألوان مستقلة عن شكل التصميم — اختار الشكل من فوق واللون من هنا.</div>
    <div class="palGrid">${PALS.map(([id,name,sw,c])=>`<div class="palCard ${id===cur?'on':''}" data-hx="palset" data-p="${id}"><div class="palSw" style="background:${c?c.hero:'linear-gradient(120deg,var(--card),var(--acc))'}"><i style="background:${c?c.ic:'var(--ic-bg)'}"></i></div><div class="palN">${name}</div></div>`).join('')}</div>`)};
  HX.palset=function(el){ls.set('palette',el.dataset.p);applyPalette(el.dataset.p);toast('اتغيّرت الألوان ✔');HX.theme()};
  const _d=HX.skindef;HX.skindef=function(){ls.set('palette','auto');_d()};
}
})();


// ===== 18) صفحة الإعدادات المجمّعة =====
window.settingsPage=function(){
  setTab('all');$('viewTitle').textContent='⚙️ الإعدادات';document.body.classList.remove('gnavOn');
  const cell=(k,ic,t,s)=>`<div class="gTile" data-hx="${k}"><div class="gIc" style="background:var(--ic-bg)">${ic}</div><div><div class="gn">${t}</div>${s?`<div class="m" style="font-size:11px">${s}</div>`:''}</div></div>`;
  $('list').innerHTML=`<div class="gHome"><div class="gSec"><span>المظهر</span></div><div class="gRow gTiles gHubs">
   ${cell('theme','🎨','المظهر والألوان','شكل التصميم ومجموعة الألوان')}${cell('order','↕','ترتيب الرئيسية','الأقسام القديمة وإخفاؤها')}</div>
   <div class="gSec"><span>التشغيل والصلاة</span></div><div class="gRow gTiles gHubs">${cell('pal','🔔','منبّه الصلاة والصامت')}${cell('remind','⏰','التذكيرات')}${cell('offline','📥','بدون إنترنت')}${cell('favcheck','🩺','فحص المفضلة')}</div>
   <div class="gSec"><span>الحساب والبيانات</span></div><div class="gRow gTiles gHubs">${cell('backup','💾','نسخة احتياطية')}${cell('share','🔗','مشاركة المفضلة')}${cell('lock','🔐','قفل التطبيق')}${cell('guest','🔒','الوضع المقيّد')}</div>
   <div class="gSec"><span>أخرى</span></div><div class="gRow gTiles gHubs"><div class="gTile" data-g="classic"><div class="gIc" style="background:var(--ic-bg)">🧰</div><div><div class="gn">كل الأدوات القديمة</div><div class="m" style="font-size:11px">الرئيسية بالمجموعات</div></div></div><div class="gTile" id="stWelcome"><div class="gIc" style="background:var(--ic-bg)">🚀</div><div><div class="gn">الإعداد الأول</div><div class="m" style="font-size:11px">اللغة والموقع والاهتمامات</div></div></div></div></div>`;
  const w=$('stWelcome');if(w)w.onclick=()=>{const b=[...document.querySelectorAll('button')].find(b=>/إعادة الإعداد الأول/.test(b.textContent));b?b.click():toast('غير متاح')};
};


// ===== 19) مكتبتي: السجل + المفضلة + بعدين + أقسامي + الإحصائيات =====
window.libraryPage=function(){
  setTab('all');$('viewTitle').textContent='📚 مكتبتي';document.body.classList.remove('gnavOn');
  const R=window.recent||[],L=window.later||[];
  const tile=(attr,ic,t,c)=>`<div class="gTile" ${attr}><div class="gIc" style="background:var(--ic-bg)">${gsvg(ic,30,1.8)}</div><div><div class="gn">${t}</div><div class="m" style="font-size:11px">${c}</div></div></div>`;
  let h=`<div class="gRow gTiles gHubs">${tile('data-lb="rec"','clock','سجل الاستماع',R.length+' عنصر — كل اللي سمعته')}${tile('data-lb="fav"','star','المفضلة',favs.length+' عنصر')}${tile('data-lb="later"','book','بعدين',L.length+' محفوظ لتسمعه لاحقًا')}${tile('data-lb="mysec"','grid','أقسامي','أقسام من صنعك')}${tile('data-lb="stats"','globe','إحصائياتي','وقت الاستماع والمحطات')}${tile('data-lb="recap"','mask','حصاد الاستماع','ملخص أسبوعك')}</div>`;
  if(R.length)h+=`<div class="gSec"><span>سجل الاستماع</span><a href="#" data-lb="rec">الكل</a></div><div class="gList">${R.slice(0,10).map((r,i)=>`<div class="gRowItem" data-ri="${i}"><div class="gIc sm" style="background:var(--card);border:1px solid var(--line);color:var(--txt)">${gsvg(String(r.stationuuid).startsWith('ia:')?'mask':'radio',22)}</div><div class="gi"><b>${esc(r.name)}</b><div class="m">${esc(r.country||'')}</div></div></div>`).join('')}</div>`;
  $('list').innerHTML=`<div class="gHome">${h}</div>`;
};
$('list').addEventListener('click',e=>{
  const t=e.target.closest('[data-lb]');if(!t)return;e.preventDefault();e.stopImmediatePropagation();navPush();
  const a=t.dataset.lb;
  if(a==='rec'){setTab('rec');render(recent)}else if(a==='fav'){setTab('fav');render(favs)}else if(a==='later')laterPage();
  else if(a==='mysec'){const el=document.createElement('div');el.dataset.act='mysecMgr';$('list').appendChild(el);el.click();el.remove()}
  else if(a==='stats')statsPage();else if(a==='recap'&&HX.recap)HX.recap();
},true);

</script>
