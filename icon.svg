<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <radialGradient id="bg" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#2a1458"/><stop offset=".55" stop-color="#120a2a"/><stop offset="1" stop-color="#070412"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".35" stop-color="#e9c35a"/><stop offset=".7" stop-color="#b8891c"/><stop offset="1" stop-color="#7a5a10"/></linearGradient>
  <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc8a"/><stop offset="1" stop-color="#9a6f12"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
 </defs>
 <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
 <circle cx="512" cy="430" r="330" fill="#8b5cf6" opacity=".18" filter="url(#glow)"/>
 <!-- ring -->
 <circle cx="512" cy="512" r="400" fill="none" stroke="url(#gold2)" stroke-width="6" opacity=".55"/>
 <!-- sound waves -->
 <g fill="none" stroke="url(#gold2)" stroke-width="26" stroke-linecap="round" opacity=".9">
  <path d="M250 392 A 300 300 0 0 1 774 392"/>
  <path d="M330 452 A 210 210 0 0 1 694 452" opacity=".75"/>
 </g>
 <!-- radio body -->
 <g filter="url(#sh)">
  <rect x="222" y="470" width="580" height="330" rx="74" fill="url(#gold)"/>
  <rect x="222" y="470" width="580" height="165" rx="74" fill="url(#gloss)"/>
 </g>
 <!-- antenna -->
 <path d="M300 470 L470 300" stroke="url(#gold2)" stroke-width="22" stroke-linecap="round"/>
 <circle cx="470" cy="300" r="22" fill="#fff2b8"/>
 <!-- speaker -->
 <circle cx="372" cy="636" r="96" fill="#1a0f3a"/>
 <circle cx="372" cy="636" r="96" fill="none" stroke="#5b21b6" stroke-width="10"/>
 <circle cx="372" cy="636" r="48" fill="url(#purple)"/>
 <circle cx="372" cy="636" r="18" fill="#fff2b8"/>
 <!-- dial / tuner -->
 <rect x="520" y="560" width="220" height="60" rx="30" fill="#1a0f3a"/>
 <rect x="520" y="560" width="220" height="60" rx="30" fill="none" stroke="#5b21b6" stroke-width="8"/>
 <rect x="640" y="568" width="12" height="44" rx="6" fill="#a78bfa"/>
 <circle cx="560" cy="700" r="30" fill="#1a0f3a" stroke="#5b21b6" stroke-width="8"/>
 <circle cx="650" cy="700" r="30" fill="#1a0f3a" stroke="#5b21b6" stroke-width="8"/>
 <circle cx="740" cy="700" r="30" fill="#1a0f3a" stroke="#5b21b6" stroke-width="8"/>
</svg>
